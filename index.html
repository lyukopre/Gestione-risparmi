<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<title>Gestione Risparmi 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#4f6df5;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e4e8f0;--green:#169447;--red:#d83f45}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}.bar{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:17px}.year{display:flex;gap:6px}.year select,.year button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}.year button{background:var(--accent);color:white;border-color:var(--accent)}main{max-width:760px;margin:auto;padding:16px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bottomnav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:11px}.bottomnav button.active{background:#e9edff;color:var(--accent);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(22,32,51,.03)}h1,h2,h3{margin:0 0 12px}h2{font-size:17px}h3{font-size:14px}.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(2,1fr)}.stat{background:var(--bg);border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted);font-size:11px}.value{font-size:19px;font-weight:800;margin-top:3px}.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted);font-size:13px}.chart{height:220px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select,.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:42px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f7;color:var(--text)}.danger{background:#ffe8e9;color:var(--red)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.expense{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}.expense .wide{grid-column:1/-1}.expense input,.expense select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px}.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;border:0;background:var(--accent);color:#fff;width:55px;height:55px;border-radius:50%;font-size:28px;box-shadow:0 5px 18px #4f6df555}.modal{display:none;position:fixed;inset:0;z-index:50;background:#17203388;align-items:flex-end}.modal.open{display:flex}.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.swatches{display:flex;gap:10px}.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.swatch:active{border-color:var(--text)}@media(min-width:700px){.bottomnav{position:static;max-width:760px;margin:20px auto;border:1px solid var(--line);border-radius:14px;padding:8px}.fab{bottom:28px}.modal{align-items:center;justify-content:center}.sheet{width:min(500px,92%);border-radius:20px}.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="appbar"><div class="bar"><div class="title">💰 Gestione Risparmi</div><div class="year"><select id="year"></select><button id="addYear">+ Anno</button></div></div></header>
<main><section id="dashboard"></section><section id="months" hidden></section><section id="investments" hidden></section><section id="settings" hidden></section></main>
<nav class="bottomnav" id="nav"><button data-page="dashboard" class="active">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="newDate" type="date"></div><div class="field"><label>Categoria</label><select id="newCat"></select></div><div class="field"><label>Descrizione</label><input id="newDesc" placeholder="es. Cena"></div><div class="field"><label>Importo</label><input id="newAmount" type="number" step="0.01" inputmode="decimal"></div><div class="actions"><button class="btn secondary" id="cancel">Annulla</button><button class="btn primary" id="saveExpense">Salva</button></div></div></div>
<script>
const months=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];const key='gestione-risparmi-mobile-v1';const cats=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'];let page='dashboard',mi=0,charts={};
const blank=()=>months.map(name=>({name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]}));const seed={year:2026,years:{2026:{months:blank()}},investments:{previous:1900,years:{2026:Object.fromEntries(months.map((m,i)=>[m,i<7?100:0]))}},historical:{},categories:cats,theme:{accent:'#4f6df5',bg:'#f4f6fb',card:'#fff',text:'#172033'}};let data=load();
function load(){try{const x=JSON.parse(localStorage.getItem(key));if(x)return x}catch(e){}return structuredClone(seed)}function save(){localStorage.setItem(key,JSON.stringify(data))}function current(){if(!data.years[data.year])data.years[data.year]={months:blank()};return data.years[data.year].months}function euro(n){return (Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function calc(m){let income=+m.stipendio+(+m.extra||0), planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce((s,e)=>s+(+e.amount||0),0),budget=income-planned-fixed,real=planned+budget-spent-(+m.viaggi||0)-(+m.speseExtra||0);return{income,planned,fixed,spent,budget,real}}function show(name){['dashboard','months','investments','settings'].forEach(x=>document.getElementById(x).hidden=x!==name);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));page=name;render()}
function render(){if(page==='dashboard')dashboard();if(page==='months')monthsPage();if(page==='investments')investPage();if(page==='settings')settingsPage()}
function dashboard(){let ms=current(), total={income:0,planned:0,spent:0,real:0},rows='';ms.forEach(m=>{let c=calc(m);Object.keys(total).forEach(k=>total[k]+=c[k]);rows+=`<tr><td>${m.name}</td><td>${euro(c.income)}</td><td>${euro(c.spent)}</td><td class="${c.real>=0?'pos':'neg'}">${euro(c.real)}</td></tr>`});document.getElementById('dashboard').innerHTML=`<div class="grid stats"><div class="stat"><small>Entrate</small><div class="value">${euro(total.income)}</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">${euro(total.planned)}</div></div><div class="stat"><small>Spese</small><div class="value">${euro(total.spent)}</div></div><div class="stat"><small>Risparmio reale</small><div class="value ${total.real>=0?'pos':'neg'}">${euro(total.real)}</div></div></div><div class="card"><h2>Andamento annuale</h2><div class="chart"><canvas id="line"></canvas></div></div><div class="card"><h2>Riepilogo ${data.year}</h2><div class="tablewrap"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card"><h2>Risparmi storici</h2><p class="muted">Anni precedenti non tracciati mese per mese.</p><div class="actions" style="margin-top:10px"><button class="btn secondary" id="addHistorical">Aggiungi anno</button></div>${Object.entries(data.historical).map(([y,v])=>`<div class="expense"><b>${y}</b><input data-historical="${y}" type="number" value="${v}"><button class="btn danger" data-deletehistorical="${y}">Elimina</button></div>`).join('')}</div>`;if(charts.line)charts.line.destroy();charts.line=new Chart(document.getElementById('line'),{type:'line',data:{labels:months.map(x=>x.slice(0,3)),datasets:[{label:'Risparmio reale',data:ms.map(m=>calc(m).real),borderColor:data.theme.accent,tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});document.getElementById('addHistorical').onclick=()=>{let y=prompt('Anno');if(y&&!data.historical[y]){data.historical[y]=0;save();render()}};document.querySelectorAll('[data-historical]').forEach(x=>x.onchange=()=>{data.historical[x.dataset.historical]=+x.value||0;save()});document.querySelectorAll('[data-deletehistorical]').forEach(x=>x.onclick=()=>{delete data.historical[x.dataset.deletehistorical];save();render()})}
function monthsPage(){let ms=current(),m=ms[mi],c=calc(m);document.getElementById('months').innerHTML=`<div class="tabs">${ms.map((x,i)=>`<button class="${i===mi?'active':''}" data-month="${i}">${x.name.slice(0,3)}</button>`).join('')}</div><div class="card"><h2>${m.name} ${data.year}</h2><div class="formgrid"><div class="field"><label>Stipendio</label><input id="salary" type="number" value="${m.stipendio}"></div><div class="field"><label>Entrate extra</label><input id="extra" type="number" value="${m.extra}"></div><div class="field"><label>Risparmio %</label><input id="percent" type="number" value="${m.percent}"></div><div class="field"><label>Auto</label><input id="auto" type="number" value="${m.fisse.auto}"></div><div class="field"><label>Telefono</label><input id="phone" type="number" value="${m.fisse.telefono}"></div><div class="field"><label>Abbonamenti</label><input id="subs" type="number" value="${m.fisse.abbonamenti}"></div></div><button class="btn primary" id="saveConfig">Salva configurazione</button></div><div class="grid stats"><div class="stat"><small>Entrate</small><div class="value">${euro(c.income)}</div></div><div class="stat"><small>Budget variabili</small><div class="value">${euro(c.budget)}</div></div><div class="stat"><small>Spese</small><div class="value">${euro(c.spent)}</div></div><div class="stat"><small>Reale</small><div class="value ${c.real>=0?'pos':'neg'}">${euro(c.real)}</div></div></div><div class="card"><h2>Registro spese</h2><div id="expenseList">${m.expenses.map((e,i)=>`<div class="expense" data-exp="${i}"><input data-field="date" type="date" value="${e.date}"><select data-field="cat">${data.categories.map(x=>`<option ${x===e.cat?'selected':''}>${x}</option>`).join('')}</select><input class="wide" data-field="desc" value="${e.desc}" placeholder="Descrizione"><input data-field="amount" type="number" value="${e.amount}"><button class="btn danger" data-delete="${i}">Elimina</button></div>`).join('')||'<p class="muted">Nessuna spesa registrata.</p>'}</div></div>`;document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{mi=+b.dataset.month;render()});document.getElementById('saveConfig').onclick=()=>{m.stipendio=+salary.value||0;m.extra=+extra.value||0;m.percent=+percent.value||0;m.fisse.auto=+auto.value||0;m.fisse.telefono=+phone.value||0;m.fisse.abbonamenti=+subs.value||0;save();render()};document.querySelectorAll('[data-exp]').forEach(row=>{let i=+row.dataset.exp;row.querySelectorAll('[data-field]').forEach(input=>input.onchange=()=>{let f=input.dataset.field;if(f==='date')m.expenses[i].date=input.value;if(f==='cat')m.expenses[i].cat=input.value;if(f==='desc')m.expenses[i].desc=input.value;if(f==='amount')m.expenses[i].amount=+input.value||0;save()});});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{m.expenses.splice(+b.dataset.delete,1);save();render()})}
function investPage(){let inv=data.investments;let av=inv.years[data.year]||{};document.getElementById('investments').innerHTML=`<div class="card"><h2>Investimenti</h2><div class="field"><label>Totale anni precedenti</label><input id="previous" type="number" value="${inv.previous}"></div><button class="btn primary" id="savePrevious">Salva</button></div><div class="card"><h2>Investimenti mensili ${data.year}</h2>${months.map(m=>`<div class="expense"><b>${m}</b><input data-invest="${m}" type="number" value="${av[m]||0}"></div>`).join('')}</div>`;document.getElementById('savePrevious').onclick=()=>{inv.previous=+previous.value||0;save();render()};document.querySelectorAll('[data-invest]').forEach(x=>x.onchange=()=>{av[x.dataset.invest]=+x.value||0;inv.years[data.year]=av;save()})}
function settingsPage(){document.getElementById('settings').innerHTML=`<div class="card"><h2>Aspetto</h2><div class="formgrid"><div class="field"><label>Colore principale</label><input id="accent" type="color" value="${data.theme.accent}"></div><div class="field"><label>Sfondo</label><input id="bg" type="color" value="${data.theme.bg}"></div></div><div class="swatches"><button class="swatch" data-theme="#4f6df5" style="background:#4f6df5"></button><button class="swatch" data-theme="#1f9d55" style="background:#1f9d55"></button><button class="swatch" data-theme="#9d6dff" style="background:#9d6dff"></button><button class="swatch" data-theme="#e08a1e" style="background:#e08a1e"></button></div></div><div class="card"><h2>Categorie</h2><div class="actions"><input id="newCategory" class="input" placeholder="Nuova categoria"><button class="btn primary" id="addCategory">Aggiungi</button></div><p style="margin-top:10px">${data.categories.join(' · ')}</p></div><div class="card"><h2>Backup manuale</h2><p class="muted">Nessuna notifica automatica.</p><div class="actions" style="margin-top:10px"><button class="btn primary" id="export">Esporta JSON</button><button class="btn secondary" id="importButton">Importa JSON</button><input hidden id="import" type="file" accept=".json"></div></div>`;accent.oninput=()=>{data.theme.accent=accent.value;apply();save()};bg.oninput=()=>{data.theme.bg=bg.value;apply();save()};document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{data.theme.accent=x.dataset.theme;apply();save();render()});addCategory.onclick=()=>{let v=newCategory.value.trim();if(v&&!data.categories.includes(v)){data.categories.push(v);save();render()}};export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gestione-risparmi.json';a.click()};importButton.onclick=()=>import.click();import.onchange=e=>{let r=new FileReader();r.onload=()=>{data=JSON.parse(r.result);save();apply();render()};r.readAsText(e.target.files[0])}}
function apply(){document.documentElement.style.setProperty('--accent',data.theme.accent);document.documentElement.style.setProperty('--bg',data.theme.bg)}document.getElementById('nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(b)show(b.dataset.page)};document.getElementById('year').onchange=e=>{data.year=+e.target.value;save();render()};document.getElementById('addYear').onclick=()=>{let y=Math.max(...Object.keys(data.years).map(Number))+1;data.years[y]={months:blank()};data.investments.years[y]=Object.fromEntries(months.map(m=>[m,0]));data.year=y;save();buildYear();render()};function buildYear(){year.innerHTML=Object.keys(data.years).sort().map(y=>`<option ${+y===data.year?'selected':''}>${y}</option>`).join('')}document.getElementById('fab').onclick=()=>{newDate.value=new Date().toISOString().slice(0,10);newCat.innerHTML=data.categories.map(x=>`<option>${x}</option>`).join('');newDesc.value='';newAmount.value='';modal.classList.add('open')};document.getElementById('cancel').onclick=()=>modal.classList.remove('open');document.getElementById('saveExpense').onclick=()=>{let d=newDate.value||new Date().toISOString().slice(0,10),monthIndex=new Date(d+'T00:00:00').getMonth();current()[monthIndex].expenses.push({date:d,cat:newCat.value,desc:newDesc.value,amount:+newAmount.value||0});save();modal.classList.remove('open');mi=monthIndex;show('months')};apply();buildYear();show('dashboard');
</script>
</body>
</html>
