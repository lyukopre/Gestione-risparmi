<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<title>Gestione Risparmi 2026</title>
<style>
:root{--a:#4f6df5;--bg:#f4f6fb;--card:#fff;--text:#182235;--muted:#697386;--line:#e3e7ef;--green:#168447;--red:#d63d47}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.topin{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800}.year{display:flex;gap:6px}.year select,.year button{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card)}.year button,.primary{background:var(--a)!important;border-color:var(--a)!important;color:#fff!important}main{max-width:760px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.nav{max-width:760px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:9px 2px;font-size:12px}.nav button.active{background:#e9edff;color:var(--a);font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--bg);border-radius:12px;padding:13px}.stat small{display:block;color:var(--muted);font-size:11px}.value{font-size:19px;font-weight:800;margin-top:4px}.pos{color:var(--green)}.neg{color:var(--red)}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}.tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 5px}.field input,.field select,.expense input,.expense select,.catinput{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.secondary{background:#eef1f7;color:var(--text)}.danger{background:#ffe8e9;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.expense{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.expense .wide{grid-column:1/-1}.fab{position:fixed;right:18px;bottom:20px;z-index:8;width:56px;height:56px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:28px;box-shadow:0 5px 18px #4f6df555}.modal{display:none;position:fixed;inset:0;z-index:20;background:#17203388;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.hidden{display:none!important}.themes{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.theme{width:42px;height:42px;border-radius:50%;border:3px solid transparent}.theme.selected{border-color:var(--text)}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center}.sheet{width:500px;border-radius:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">💰 Gestione Risparmi</div><div class="year"><select id="yearSelect"></select><button id="addYear">+ Anno</button></div></div></header>
<main><nav class="nav" id="nav"><button class="active" data-page="dashboard">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav><section id="dashboard"></section><section id="months" class="hidden"></section><section id="investments" class="hidden"></section><section id="settings" class="hidden"></section></main>
<button class="fab" id="fab">+</button><div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="nDate" type="date"></div><div class="field"><label>Categoria</label><select id="nCat"></select></div><div class="field"><label>Descrizione</label><input id="nDesc"></div><div class="field"><label>Importo</label><input id="nAmount" type="number" step=".01" inputmode="decimal"></div><div class="actions"><button class="btn secondary" id="closeModal">Annulla</button><button class="btn primary" id="saveNew">Salva</button></div></div></div>
<script>
(function(){'use strict';
var MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];var CATS=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'];var KEY='gestione-risparmi-completo-v1';
function blank(){return MONTHS.map(function(name){return{name:name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]};});}
var seed={currentYear:2026,years:{2026:{months:blank()}},investments:{previous:1900,years:{2026:{}}},historical:{},categories:CATS.slice(),theme:{accent:'#4f6df5',bg:'#f4f6fb'}};MONTHS.forEach(function(m,i){seed.investments.years[2026][m]=i<7?100:0;});
var DATA;try{DATA=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){DATA=null;}if(!DATA||!DATA.years)DATA=seed;if(!DATA.categories)DATA.categories=CATS.slice();if(!DATA.investments)DATA.investments=seed.investments;if(!DATA.investments.years)DATA.investments.years={};if(!DATA.investments.years[DATA.currentYear])DATA.investments.years[DATA.currentYear]={};if(!DATA.historical)DATA.historical={};if(!DATA.theme)DATA.theme=seed.theme;
var page='dashboard',monthIndex=0;
function save(){localStorage.setItem(KEY,JSON.stringify(DATA));}function months(){return DATA.years[DATA.currentYear].months;}function money(n){return(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}function calc(m){var income=(+m.stipendio||0)+(+m.extra||0),planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce(function(s,e){return s+(+e.amount||0);},0),budget=income-planned-fixed,travel=+m.viaggi||0,extra=+m.speseExtra||0;return{income:income,planned:planned,fixed:fixed,spent:spent,budget:budget,real:income-fixed-spent-travel-extra};}
function activate(name){page=name;['dashboard','months','investments','settings'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==name);});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===name);});render();}function render(){if(page==='dashboard')renderDashboard();if(page==='months')renderMonths();if(page==='investments')renderInvestments();if(page==='settings')renderSettings();}
function renderDashboard(){var total={income:0,planned:0,spent:0,real:0},rows='';months().forEach(function(m){var c=calc(m);Object.keys(total).forEach(function(k){total[k]+=c[k];});rows+='<tr><td>'+m.name+'</td><td>'+money(c.income)+'</td><td>'+money(c.spent)+'</td><td class="'+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</td></tr>';});document.getElementById('dashboard').innerHTML='<div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(total.income)+'</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">'+money(total.planned)+'</div></div><div class="stat"><small>Spese variabili</small><div class="value">'+money(total.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(total.real>=0?'pos':'neg')+'">'+money(total.real)+'</div></div></div><div class="card"><h2>Riepilogo '+DATA.currentYear+'</h2><div class="table"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h2>Risparmi storici</h2><p class="muted">Aggiungi eventuali anni precedenti.</p><div class="actions"><button class="btn secondary" id="addHistory">Aggiungi anno</button></div>'+Object.keys(DATA.historical).map(function(y){return'<div class="expense"><b>'+y+'</b><input data-hist="'+y+'" type="number" value="'+DATA.historical[y]+'"><button class="btn danger" data-delhist="'+y+'">Elimina</button></div>';}).join('')+'</div>';var add=document.getElementById('addHistory');if(add)add.onclick=function(){var y=prompt('Anno');if(y&&!DATA.historical[y]){DATA.historical[y]=0;save();render();}};document.querySelectorAll('[data-hist]').forEach(function(i){i.onchange=function(){DATA.historical[i.dataset.hist]=+i.value||0;save();};});document.querySelectorAll('[data-delhist]').forEach(function(b){b.onclick=function(){delete DATA.historical[b.dataset.delhist];save();render();};});}
function renderMonths(){var m=months()[monthIndex],c=calc(m);var tabs=months().map(function(x,i){return'<button class="'+(i===monthIndex?'active':'')+'" data-mi="'+i+'">'+x.name.slice(0,3)+'</button>';}).join('');var expenses=m.expenses.map(function(e,i){return'<div class="expense" data-ei="'+i+'"><input data-f="date" type="date" value="'+e.date+'"><select data-f="cat">'+DATA.categories.map(function(x){return'<option '+(x===e.cat?'selected':'')+'>'+x+'</option>';}).join('')+'</select><input class="wide" data-f="desc" value="'+String(e.desc||'').replace(/"/g,'&quot;')+'" placeholder="Descrizione"><input data-f="amount" type="number" step=".01" value="'+(e.amount||0)+'"><button class="btn danger" data-delexp="'+i+'">Elimina</button></div>';}).join('')||'<p class="muted">Nessuna spesa.</p>';document.getElementById('months').innerHTML='<div class="tabs">'+tabs+'</div><div class="card"><h2>'+m.name+' '+DATA.currentYear+'</h2><div class="form"><div class="field"><label>Stipendio</label><input id="salary" type="number" value="'+m.stipendio+'"></div><div class="field"><label>Entrate extra</label><input id="extra" type="number" value="'+m.extra+'"></div><div class="field"><label>Risparmio %</label><input id="percent" type="number" value="'+m.percent+'"></div><div class="field"><label>Auto</label><input id="auto" type="number" value="'+m.fisse.auto+'"></div><div class="field"><label>Telefono</label><input id="phone" type="number" value="'+m.fisse.telefono+'"></div><div class="field"><label>Abbonamenti</label><input id="subs" type="number" value="'+m.fisse.abbonamenti+'"></div><div class="field"><label>Spese viaggi</label><input id="travel" type="number" value="'+(m.viaggi||0)+'"></div><div class="field"><label>Spese extra</label><input id="other" type="number" value="'+(m.speseExtra||0)+'"></div></div><button class="btn primary" id="saveConfig">Salva configurazione</button></div><div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(c.income)+'</div></div><div class="stat"><small>Budget variabili</small><div class="value">'+money(c.budget)+'</div></div><div class="stat"><small>Spese</small><div class="value">'+money(c.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</div></div></div><div class="card"><h2>Registro spese</h2>'+expenses+'</div>';document.querySelectorAll('[data-mi]').forEach(function(b){b.onclick=function(){monthIndex=+b.dataset.mi;render();};});document.getElementById('saveConfig').onclick=function(){m.stipendio=+document.getElementById('salary').value||0;m.extra=+document.getElementById('extra').value||0;m.percent=+document.getElementById('percent').value||0;m.fisse.auto=+document.getElementById('auto').value||0;m.fisse.telefono=+document.getElementById('phone').value||0;m.fisse.abbonamenti=+document.getElementById('subs').value||0;m.viaggi=+document.getElementById('travel').value||0;m.speseExtra=+document.getElementById('other').value||0;save();render();};document.querySelectorAll('[data-ei]').forEach(function(row){var i=+row.dataset.ei;row.querySelectorAll('[data-f]').forEach(function(input){input.onchange=function(){var f=input.dataset.f;if(f==='date')m.expenses[i].date=input.value;if(f==='cat')m.expenses[i].cat=input.value;if(f==='desc')m.expenses[i].desc=input.value;if(f==='amount')m.expenses[i].amount=+input.value||0;save();};});});document.querySelectorAll('[data-delexp]').forEach(function(b){b.onclick=function(){m.expenses.splice(+b.dataset.delexp,1);save();render();};});}
function renderInvestments(){var av=DATA.investments.years[DATA.currentYear]||{};document.getElementById('investments').innerHTML='<div class="card"><h2>Investimenti</h2><div class="field"><label>Totale anni precedenti</label><input id="previous" type="number" value="'+(DATA.investments.previous||0)+'"></div><button class="btn primary" id="savePrevious">Salva</button></div><div class="card"><h2>Investimenti mensili '+DATA.currentYear+'</h2>'+MONTHS.map(function(m){return'<div class="expense"><b>'+m+'</b><input data-invest="'+m+'" type="number" value="'+(av[m]||0)+'"></div>';}).join('')+'</div>';document.getElementById('savePrevious').onclick=function(){DATA.investments.previous=+document.getElementById('previous').value||0;save();render();};document.querySelectorAll('[data-invest]').forEach(function(i){i.onchange=function(){av[i.dataset.invest]=+i.value||0;DATA.investments.years[DATA.currentYear]=av;save();};});}
function renderSettings(){document.getElementById('settings').innerHTML='<div class="card"><h2>Temi e colori</h2><div class="form"><div class="field"><label>Colore principale</label><input id="accent" type="color" value="'+DATA.theme.accent+'"></div><div class="field"><label>Sfondo</label><input id="bg" type="color" value="'+DATA.theme.bg+'"></div></div><div class="themes"><button class="theme" title="Chiaro" data-accent="#4f6df5" data-bg="#f4f6fb" style="background:#4f6df5"></button><button class="theme" title="Scuro" data-accent="#8da2ff" data-bg="#151a26" style="background:#151a26"></button><button class="theme" title="Verde" data-accent="#168447" data-bg="#edf8f0" style="background:#168447"></button><button class="theme" title="Ambra" data-accent="#d78619" data-bg="#fff7e8" style="background:#d78619"></button><button class="theme" title="Viola" data-accent="#8d5cf6" data-bg="#f5efff" style="background:#8d5cf6"></button></div></div><div class="card"><h2>Categorie</h2><div class="actions"><input id="newCategory" class="catinput" placeholder="Nuova categoria"><button class="btn primary" id="addCategory">Aggiungi</button></div><p class="muted">'+DATA.categories.join(' · ')+'</p></div><div class="card"><h2>Backup manuale</h2><p class="muted">La notifica automatica è stata rimossa.</p><div class="actions"><button class="btn primary" id="exportJson">Esporta JSON</button><button class="btn secondary" id="exportExcel">Esporta Excel</button><button class="btn secondary" id="importJson">Importa JSON</button><input id="fileJson" type="file" accept=".json" hidden></div></div>';document.getElementById('accent').oninput=function(e){DATA.theme.accent=e.target.value;apply();save();};document.getElementById('bg').oninput=function(e){DATA.theme.bg=e.target.value;apply();save();};document.querySelectorAll('[data-accent]').forEach(function(b){b.onclick=function(){DATA.theme.accent=b.dataset.accent;DATA.theme.bg=b.dataset.bg;apply();save();render();};});document.getElementById('addCategory').onclick=function(){var v=document.getElementById('newCategory').value.trim();if(v&&!DATA.categories.includes(v)){DATA.categories.push(v);save();render();}};document.getElementById('exportJson').onclick=function(){download('gestione-risparmi.json',JSON.stringify(DATA,null,2),'application/json');};document.getElementById('exportExcel').onclick=exportExcel;document.getElementById('importJson').onclick=function(){document.getElementById('fileJson').click();};document.getElementById('fileJson').onchange=function(e){var r=new FileReader();r.onload=function(){try{DATA=JSON.parse(r.result);save();apply();fillYears();render();}catch(err){alert('File JSON non valido');}};r.readAsText(e.target.files[0]);};}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function exportExcel(){var lines=[];lines.push(['Gestione Risparmi',DATA.currentYear].join('\t'));lines.push(['Dashboard'].join('\t'));lines.push(['Mese','Entrate','Risparmio pianificato','Spese fisse','Budget variabili','Spese variabili','Viaggi','Extra','Risparmio reale'].join('\t'));months().forEach(function(m){var c=calc(m);lines.push([m.name,c.income,c.planned,c.fixed,c.budget,c.spent,m.viaggi||0,m.speseExtra||0,c.real].join('\t'));});lines.push('');lines.push(['Investimenti','Importo'].join('\t'));lines.push(['Totale anni precedenti',DATA.investments.previous||0].join('\t'));var inv=DATA.investments.years[DATA.currentYear]||{};MONTHS.forEach(function(m){lines.push(['Investimento '+m,inv[m]||0].join('\t'));});lines.push('');lines.push(['Risparmi storici','Importo'].join('\t'));Object.keys(DATA.historical).forEach(function(y){lines.push([y,DATA.historical[y]].join('\t'));});months().forEach(function(m){lines.push('');lines.push(['REGISTRO '+m.name].join('\t'));lines.push(['Data','Categoria','Descrizione','Importo'].join('\t'));m.expenses.forEach(function(e){lines.push([e.date,e.cat,e.desc,e.amount].map(esc).join('\t'));});});download('backup_gestione_risparmi_'+DATA.currentYear+'.xls',lines.join('\n'),'application/vnd.ms-excel');}
function apply(){document.documentElement.style.setProperty('--a',DATA.theme.accent);document.documentElement.style.setProperty('--bg',DATA.theme.bg);}
function fillYears(){document.getElementById('yearSelect').innerHTML=Object.keys(DATA.years).sort().map(function(y){return'<option value="'+y+'" '+(+y===DATA.currentYear?'selected':'')+'>'+y+'</option>';}).join('');}
document.getElementById('nav').onclick=function(e){var b=e.target.closest('button[data-page]');if(b)activate(b.dataset.page);};document.getElementById('yearSelect').onchange=function(e){DATA.currentYear=+e.target.value;monthIndex=0;save();render();};document.getElementById('addYear').onclick=function(){var y=Math.max.apply(null,Object.keys(DATA.years).map(Number))+1;DATA.years[y]={months:blank()};DATA.investments.years[y]={};DATA.currentYear=y;save();fillYears();render();};document.getElementById('fab').onclick=function(){document.getElementById('nDate').value=new Date().toISOString().slice(0,10);document.getElementById('nCat').innerHTML=DATA.categories.map(function(c){return'<option>'+c+'</option>';}).join('');document.getElementById('nDesc').value='';document.getElementById('nAmount').value='';document.getElementById('modal').classList.add('open');};document.getElementById('closeModal').onclick=function(){document.getElementById('modal').classList.remove('open');};document.getElementById('saveNew').onclick=function(){var d=document.getElementById('nDate').value||new Date().toISOString().slice(0,10),idx=new Date(d+'T00:00:00').getMonth();months()[idx].expenses.push({date:d,cat:document.getElementById('nCat').value,desc:document.getElementById('nDesc').value,amount:+document.getElementById('nAmount').value||0});save();document.getElementById('modal').classList.remove('open');monthIndex=idx;activate('months');};apply();fillYears();activate('dashboard');
})();
</script>
</body>
</html>
