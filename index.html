<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6df5">
  <title>Gestione Risparmi</title>

  <!-- Librerie esterne usate dai grafici e dall'import/export Excel. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --accent: #4f6df5;
      --background: #f4f6fb;
      --surface: #ffffff;
      --text: #182235;
      --muted: #697386;
      --line: #e3e7ef;
      --positive: #168447;
      --negative: #d63d47;
      --warning: #c98a12;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --background: #0f1117;
      --surface: #1a1d27;
      --text: #eef1f7;
      --muted: #9aa3b8;
      --line: #2c3140;
      --positive: #39d17f;
      --negative: #ff6b6b;
      --warning: #e8b64a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: calc(90px + var(--safe-bottom));
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: max(14px, env(safe-area-inset-top)) 14px 12px;
    }

    .topbar-inner {
      max-width: 760px;
      min-height: 50px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { font-size: 16px; font-weight: 800; }
    .year-controls { display: flex; gap: 6px; }

    .year-controls select,
    .year-controls button,
    .btn,
    .field input,
    .field select,
    .field textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }

    .year-controls select,
    .year-controls button { min-height: 42px; padding: 8px 10px; }

    .btn {
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }

    .btn-secondary { background: var(--background); }
    .btn-danger { background: #ffe8e9; color: var(--negative); }
    [data-theme="dark"] .btn-danger { background: #3a1f22; }

    main { max-width: 760px; margin: auto; padding: 12px 14px 24px; }

    .navigation {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 6px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
    }

    .navigation button {
      min-height: 56px;
      padding: 8px 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .navigation button.active {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-weight: 800;
    }

    .card {
      margin-bottom: 14px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.045);
    }

    h2 { margin: 0 0 10px; font-size: 17px; }
    h3 { margin: 16px 0 8px; font-size: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    .hidden { display: none !important; }
    .positive { color: var(--positive); }
    .negative { color: var(--negative); }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat { padding: 11px; border-radius: 12px; background: var(--background); }
    .stat small { display: block; color: var(--muted); font-size: 10px; }
    .stat-value { margin-top: 4px; font-size: 17px; font-weight: 800; }

    .chart { height: 210px; }
    .chart-large { height: 250px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; }
    th { color: var(--muted); }

    .month-tabs, .scope-tabs { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
    .month-tabs button, .scope-tabs button {
      white-space: nowrap;
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--accent);
      font-weight: 700;
    }
    .month-tabs button.active, .scope-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 10px; font-size: 16px; }
    .field textarea { min-height: 150px; resize: vertical; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .actions .btn { flex: 1 1 140px; }

    .week-row, .history-row, .goal-row, .trend-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .week-row:last-child, .history-row:last-child, .goal-row:last-child, .trend-row:last-child { border-bottom: 0; }
    .week-head, .goal-head, .trend-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .week-head { margin-bottom: 6px; font-size: 12px; }
    .week-head b { font-size: 13px; }
    .week-bar { height: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--background); }
    .week-fill { height: 100%; border-radius: 6px; }
    .week-foot { display: flex; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: 11px; }

    .expense-list { border-top: 1px solid var(--line); }
    .expense-row { display: grid; grid-template-columns: 86px 1fr 82px 30px; gap: 5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .expense-row input, .expense-row select { width: 100%; min-width: 0; min-height: 30px; padding: 4px 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; }
    .expense-row .description { grid-column: 2; }
    .expense-subcategory { grid-column: 1 / -1; }
    .expense-delete { min-height: 30px; padding: 0; border: 0; border-radius: 6px; background: #ffe8e9; color: var(--negative); }
    [data-theme="dark"] .expense-delete { background: #3a1f22; }

    .category-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .category-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .category-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .category-value { font-weight: 700; }

    .goal-card { padding: 12px; margin-bottom: 10px; border-radius: 12px; background: var(--background); }
    .goal-name { font-weight: 700; }
    .goal-amount { color: var(--accent); font-weight: 800; }
    .goal-bar { height: 8px; margin-top: 8px; overflow: hidden; border-radius: 4px; background: var(--line); }
    .goal-fill { height: 100%; border-radius: 4px; background: var(--accent); }
    .goal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--muted); font-size: 11px; }

    .fab {
      position: fixed;
      right: 16px;
      bottom: calc(20px + var(--safe-bottom));
      z-index: 50;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 28px;
      box-shadow: 0 5px 18px rgba(0,0,0,.28);
    }

    .modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: flex-end; background: rgba(0,0,0,.5); }
    .modal.open { display: flex; }
    .modal-sheet { width: 100%; padding: 20px 16px calc(20px + var(--safe-bottom)); border-radius: 20px 20px 0 0; background: var(--surface); }

    .error-box { color: var(--negative); white-space: pre-wrap; }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .brand { font-size: 14px; }
      .navigation { grid-template-columns: repeat(2, 1fr); }
      .expense-row { grid-template-columns: 1fr 1fr; }
      .expense-row .description, .expense-subcategory { grid-column: 1 / -1; }
    }

    @media (min-width: 700px) {
      body { padding-bottom: 30px; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .modal { align-items: center; justify-content: center; }
      .modal-sheet { width: 500px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">💰 Gestione Risparmi</div>
      <div class="year-controls">
        <select id="yearSelect" aria-label="Anno"></select>
        <button id="addYearButton" class="btn-primary">+ Anno</button>
      </div>
    </div>
  </header>

  <main>
    <!-- La navigazione ha cinque voci: la griglia diventa responsive via CSS. -->
    <nav id="navigation" class="navigation">
      <button data-page="dashboard" class="active">📊<br>Dashboard</button>
      <button data-page="months">🗓️<br>Mesi</button>
      <button data-page="goals">🎯<br>Obiettivi</button>
      <button data-page="trends">📈<br>Trend</button>
      <button data-page="settings">⚙️<br>Impostazioni</button>
    </nav>

    <section id="dashboardPage"></section>
    <section id="monthsPage" class="hidden"></section>
    <section id="goalsPage" class="hidden"></section>
    <section id="trendsPage" class="hidden"></section>
    <section id="settingsPage" class="hidden"></section>
  </main>

  <button id="addExpenseButton" class="fab" aria-label="Aggiungi spesa">+</button>

  <!-- Finestra per l'inserimento rapido di una spesa. -->
  <div id="expenseModal" class="modal">
    <div class="modal-sheet">
      <h2>Aggiungi spesa</h2>
      <div class="field"><label for="newExpenseDate">Data</label><input id="newExpenseDate" type="date"></div>
      <div class="field"><label for="newExpenseCategory">Categoria</label><select id="newExpenseCategory"></select></div>
      <div class="field"><label for="newExpenseSubcategory">Sotto-categoria</label><select id="newExpenseSubcategory"></select></div>
      <div class="field"><label for="newExpenseDescription">Descrizione</label><input id="newExpenseDescription"></div>
      <div class="field"><label for="newExpenseAmount">Importo</label><input id="newExpenseAmount" type="number" step="0.01"></div>
      <div class="actions">
        <button id="closeExpenseModal" class="btn btn-secondary">Annulla</button>
        <button id="saveNewExpense" class="btn btn-primary">Salva</button>
      </div>
    </div>
  </div>

  <div id="toast" style="position:fixed;left:0;right:0;bottom:18px;z-index:200;display:none;justify-content:center;pointer-events:none">
    <span id="toastMessage" style="padding:10px 18px;border-radius:999px;background:var(--text);color:var(--background);font-weight:700"></span>
  </div>

  <script>
    (() => {
      'use strict';

      /* =========================
         Costanti e stato applicazione
         ========================= */
      const MONTHS = [
        'Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
        'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'
      ];

      const DEFAULT_CATEGORIES = {
        'Spesa': ['Supermercato', 'Mercato', 'Online'],
        'Trasporti': ['Benzina', 'Mezzi pubblici', 'Taxi', 'Manutenzione'],
        'Ristoranti': ['Pranzi', 'Cene', 'Delivery'],
        'Shopping': ['Vestiti', 'Casa', 'Tech', 'Regali'],
        'Salute': ['Farmacia', 'Medico', 'Palestra'],
        'Intrattenimento': ['Film', 'Libri', 'Giochi', 'Concerti'],
        'Uscite serali': ['Bar', 'Aperitivi', 'Discoteca'],
        'Viaggi': ['Voli', 'Hotel', 'Attività', 'Ristoranti viaggio'],
        'Altro': ['Varie', 'Fai-da-te']
      };

      const DEFAULT_LABELS = {
        auto: 'Auto',
        telefono: 'Telefono',
        abbonamenti: 'Abbonamenti',
        viaggi: 'Spese viaggi',
        extra: 'Spese extra'
      };

      const CATEGORY_COLORS = [
        '#4f6df5','#d63d47','#168447','#d78619','#8d5cf6',
        '#e0578f','#16a3b8','#9aa3b8','#c98a12','#39d17f'
      ];

      const STORAGE_KEY = 'gestione-risparmi-stabile-v1';
      const state = {
        page: 'dashboard',
        monthIndex: 0,
        categoryScope: 'year',
        charts: {},
        toastTimer: null,
        data: null
      };

      /* =========================
         Creazione e migrazione dati
         ========================= */
      function createBlankMonth(name) {
        return {
          name,
          stipendio: 0,
          extra: 0,
          percent: 20,
          fisse: { auto: 0, telefono: 0, abbonamenti: 0 },
          viaggi: 0,
          speseExtra: 0,
          expenses: []
        };
      }

      function createBlankYear() {
        return { months: MONTHS.map(createBlankMonth) };
      }

      function createInitialData() {
        return {
          currentYear: new Date().getFullYear(),
          years: { [new Date().getFullYear()]: createBlankYear() },
          historical: {},
          investments: { previous: 0, years: {} },
          categories: structuredCloneSafe(DEFAULT_CATEGORIES),
          fixedLabels: { ...DEFAULT_LABELS },
          goals: [],
          theme: { accent: '#4f6df5', mode: 'light' },
          excelImported: false
        };
      }

      function structuredCloneSafe(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function normalizeData(raw) {
        const fallback = createInitialData();
        const data = raw && typeof raw === 'object' ? raw : fallback;

        if (!data.years || typeof data.years !== 'object') data.years = fallback.years;
        if (!data.currentYear || !data.years[data.currentYear]) {
          const years = Object.keys(data.years).map(Number).filter(Number.isFinite);
          data.currentYear = years.length ? years.sort((a,b) => a-b)[0] : fallback.currentYear;
        }

        Object.keys(data.years).forEach(year => {
          if (!data.years[year] || !Array.isArray(data.years[year].months)) {
            data.years[year] = createBlankYear();
          }
          while (data.years[year].months.length < 12) {
            data.years[year].months.push(createBlankMonth(MONTHS[data.years[year].months.length]));
          }
          data.years[year].months = data.years[year].months.slice(0, 12).map((month, index) => ({
            ...createBlankMonth(MONTHS[index]),
            ...month,
            name: MONTHS[index],
            fisse: { ...createBlankMonth(MONTHS[index]).fisse, ...(month.fisse || {}) },
            expenses: Array.isArray(month.expenses) ? month.expenses : []
          }));
        });

        if (!data.categories || Array.isArray(data.categories)) data.categories = structuredCloneSafe(DEFAULT_CATEGORIES);
        if (!data.fixedLabels) data.fixedLabels = { ...DEFAULT_LABELS };
        if (!data.historical) data.historical = {};
        if (!data.investments) data.investments = { previous: 0, years: {} };
        if (!data.investments.years) data.investments.years = {};
        if (!data.goals) data.goals = [];
        if (!data.theme) data.theme = { accent: '#4f6df5', mode: 'light' };
        if (!data.theme.accent) data.theme.accent = '#4f6df5';
        if (!data.theme.mode) data.theme.mode = 'light';

        // Le spese delle versioni precedenti possono non avere una sotto-categoria.
        Object.values(data.years).forEach(year => {
          year.months.forEach(month => {
            month.expenses.forEach(expense => {
              if (!('subcat' in expense)) expense.subcat = null;
              if (!expense.cat) expense.cat = 'Altro';
              if (!expense.date) expense.date = todayISO();
            });
          });
        });

        return data;
      }

      function loadData() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return normalizeData(saved ? JSON.parse(saved) : createInitialData());
        } catch (error) {
          console.error('Errore caricamento dati:', error);
          return createInitialData();
        }
      }

      function saveData(message = null) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        if (message) showToast(message);
      }

      /* =========================
         Funzioni di calcolo
         ========================= */
      function currentMonths() {
        return state.data.years[state.data.currentYear].months;
      }

      function calculateMonth(month) {
        const income = number(month.stipendio) + number(month.extra);
        const plannedSaving = income * number(month.percent) / 100;
        const fixed = number(month.fisse.auto) + number(month.fisse.telefono) + number(month.fisse.abbonamenti);
        const variableExpenses = month.expenses.reduce((sum, expense) => sum + number(expense.amount), 0);
        const travel = number(month.viaggi);
        const extra = number(month.speseExtra);

        return {
          income,
          plannedSaving,
          fixed,
          variableExpenses,
          travel,
          extra,
          // Viaggi ed extra restano fuori dal budget settimanale,
          // perché rappresentano somme accantonate per obiettivi.
          weeklyBudget: income - plannedSaving - fixed,
          // Nel risparmio reale vengono invece conteggiati come uscite.
          realSaving: income - fixed - variableExpenses - travel - extra
        };
      }

      function number(value) {
        const result = Number(value);
        return Number.isFinite(result) ? result : 0;
      }

      function money(value) {
        return number(value).toLocaleString('it-IT', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + ' €';
      }

      function todayISO() {
        return new Date().toISOString().slice(0, 10);
      }

      function formatDate(date) {
        const d = new Date(date + 'T00:00:00');
        return Number.isNaN(d.getTime()) ? date : d.toLocaleDateString('it-IT');
      }

      function calculateWeeks(month, monthIndex) {
        const calculation = calculateMonth(month);
        const totalDays = new Date(state.data.currentYear, monthIndex + 1, 0).getDate();
        const daysPerWeek = [7, 7, 7, 7, totalDays - 28].filter(days => days > 0);
        const totalBudget = Math.max(0, calculation.weeklyBudget);

        return daysPerWeek.map((days, index) => {
          const budget = totalBudget * days / totalDays;
          const spent = month.expenses.reduce((sum, expense) => {
            const date = new Date(expense.date + 'T00:00:00');
            const day = date.getDate();
            const start = index * 7 + 1;
            const end = index === daysPerWeek.length - 1 ? totalDays : start + days - 1;
            return day >= start && day <= end ? sum + number(expense.amount) : sum;
          }, 0);
          const remaining = budget - spent;
          const percentage = budget > 0 ? Math.max(0, Math.min(100, remaining / budget * 100)) : 100;
          const color = percentage >= 50 ? 'var(--positive)' : percentage >= 20 ? 'var(--warning)' : 'var(--negative)';
          return { index: index + 1, budget, spent, remaining, percentage, color };
        });
      }

      function categoryTotals(scope) {
        const totals = {};
        const months = scope === 'month' ? [currentMonths()[state.monthIndex]] : currentMonths();
        months.forEach(month => month.expenses.forEach(expense => {
          const category = expense.cat || 'Altro';
          totals[category] = (totals[category] || 0) + number(expense.amount);
        }));
        return Object.entries(totals)
          .map(([name, amount]) => ({ name, amount }))
          .filter(item => item.amount > 0)
          .sort((a,b) => b.amount - a.amount);
      }

      function subcategoryTotals() {
        const totals = {};
        currentMonths().forEach(month => month.expenses.forEach(expense => {
          const key = (expense.cat || 'Altro') + ' › ' + (expense.subcat || 'Generale');
          totals[key] = (totals[key] || 0) + number(expense.amount);
        }));
        return Object.entries(totals)
          .map(([name, amount]) => ({ name, amount }))
          .sort((a,b) => b.amount - a.amount);
      }

      function accumulatedTargetSavings() {
        let total = 0;
        Object.values(state.data.years).forEach(year => year.months.forEach(month => {
          total += number(month.viaggi) + number(month.speseExtra);
        }));
        Object.values(state.data.historical).forEach(value => total += number(value));
        return total;
      }

      /* =========================
         Utility DOM e grafici
         ========================= */
      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        const text = document.getElementById('toastMessage');
        text.textContent = message;
        toast.style.display = 'flex';
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 1600);
      }

      function destroyCharts() {
        Object.values(state.charts).forEach(chart => chart?.destroy());
        state.charts = {};
      }

      function chartColors() {
        const styles = getComputedStyle(document.documentElement);
        return {
          line: styles.getPropertyValue('--line'),
          muted: styles.getPropertyValue('--muted'),
          surface: styles.getPropertyValue('--surface')
        };
      }

      /* =========================
         Rendering pagine
         ========================= */
      function render() {
        ['dashboard','months','goals','trends','settings'].forEach(page => {
          document.getElementById(page + 'Page').classList.toggle('hidden', state.page !== page);
        });
        document.querySelectorAll('#navigation button').forEach(button => {
          button.classList.toggle('active', button.dataset.page === state.page);
        });
        destroyCharts();
        if (state.page === 'dashboard') renderDashboard();
        if (state.page === 'months') renderMonths();
        if (state.page === 'goals') renderGoals();
        if (state.page === 'trends') renderTrends();
        if (state.page === 'settings') renderSettings();
      }

      function renderDashboard() {
        const months = currentMonths();
        const calculations = months.map(calculateMonth);
        const total = calculations.reduce((sum, item) => ({
          income: sum.income + item.income,
          plannedSaving: sum.plannedSaving + item.plannedSaving,
          variableExpenses: sum.variableExpenses + item.variableExpenses,
          realSaving: sum.realSaving + item.realSaving
        }), { income: 0, plannedSaving: 0, variableExpenses: 0, realSaving: 0 });
        const categories = categoryTotals(state.categoryScope);
        const categoryTotal = categories.reduce((sum, item) => sum + item.amount, 0);

        const rows = months.map((month, index) => {
          const item = calculations[index];
          return `<tr><td>${month.name}</td><td>${money(item.income)}</td><td>${money(item.variableExpenses)}</td><td class="${item.realSaving >= 0 ? 'positive' : 'negative'}">${money(item.realSaving)}</td></tr>`;
        }).join('');

        const categoryRows = categories.length
          ? categories.map((item, index) => `<div class="category-row"><span class="category-dot" style="background:${CATEGORY_COLORS[index % CATEGORY_COLORS.length]}"></span><span class="category-name">${escapeHTML(item.name)}</span><span class="category-value">${money(item.amount)} <span class="muted">(${categoryTotal ? (item.amount / categoryTotal * 100).toFixed(0) : 0}%)</span></span></div>`).join('')
          : '<p class="muted">Nessuna spesa registrata.</p>';

        document.getElementById('dashboardPage').innerHTML = `
          <div class="stats">
            <div class="stat"><small>Entrate</small><div class="stat-value">${money(total.income)}</div></div>
            <div class="stat"><small>Risparmi pianificati</small><div class="stat-value">${money(total.plannedSaving)}</div></div>
            <div class="stat"><small>Spese variabili</small><div class="stat-value">${money(total.variableExpenses)}</div></div>
            <div class="stat"><small>Risparmio reale</small><div class="stat-value ${total.realSaving >= 0 ? 'positive' : 'negative'}">${money(total.realSaving)}</div></div>
          </div>
          <div class="card"><h2>Entrate, spese e risparmio</h2><div class="chart"><canvas id="mainChart"></canvas></div></div>
          <div class="card"><h2>Risparmio cumulato</h2><div class="chart"><canvas id="cumulativeChart"></canvas></div></div>
          <div class="card">
            <h2>Spese per categoria</h2>
            <div class="scope-tabs"><button data-scope="month" class="${state.categoryScope === 'month' ? 'active' : ''}">${MONTHS[state.monthIndex]}</button><button data-scope="year" class="${state.categoryScope === 'year' ? 'active' : ''}">Tutto ${state.data.currentYear}</button></div>
            <div class="chart"><canvas id="categoryChart"></canvas></div>
            <div>${categoryRows}</div>
          </div>
          <div class="card"><h2>Riepilogo ${state.data.currentYear}</h2><div class="table-wrap"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>${rows}</tbody></table></div></div>
        `;

        document.querySelectorAll('[data-scope]').forEach(button => button.addEventListener('click', () => {
          state.categoryScope = button.dataset.scope;
          render();
        }));

        const colors = chartColors();
        state.charts.main = new Chart(document.getElementById('mainChart'), {
          type: 'bar',
          data: {
            labels: MONTHS.map(month => month.slice(0,3)),
            datasets: [
              { label: 'Entrate', data: calculations.map(item => item.income), backgroundColor: '#4f6df5' },
              { label: 'Spese variabili', data: calculations.map(item => item.fixed + item.variableExpenses), backgroundColor: '#d63d47' },
              { label: 'Risparmio reale', data: calculations.map(item => item.realSaving), backgroundColor: '#168447' }
            ]
          },
          options: chartOptions(colors)
        });

        let running = 0;
        state.charts.cumulative = new Chart(document.getElementById('cumulativeChart'), {
          type: 'line',
          data: { labels: MONTHS.map(month => month.slice(0,3)), datasets: [{ label: 'Cumulato', data: calculations.map(item => running += item.realSaving), borderColor: '#8d5cf6', backgroundColor: '#8d5cf633', fill: true, tension: .25 }] },
          options: chartOptions(colors)
        });

        if (categories.length) {
          state.charts.category = new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: { labels: categories.map(item => item.name), datasets: [{ data: categories.map(item => item.amount), backgroundColor: categories.map((_, index) => CATEGORY_COLORS[index % CATEGORY_COLORS.length]), borderColor: colors.surface, borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { display: false } } }
          });
        }
      }

      function chartOptions(colors) {
        return {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: colors.muted } } },
          scales: { x: { ticks: { color: colors.muted }, grid: { color: colors.line } }, y: { ticks: { color: colors.muted }, grid: { color: colors.line } } }
        };
      }

      function renderMonths() {
        const months = currentMonths();
        const month = months[state.monthIndex];
        const calculation = calculateMonth(month);
        const weeks = calculateWeeks(month, state.monthIndex);
        const weekRows = weeks.map(week => `<div class="week-row"><div class="week-head"><b>Settimana ${week.index}</b><span>${money(week.remaining)} rimanenti</span></div><div class="week-bar"><div class="week-fill" style="width:${week.percentage}%;background:${week.color}"></div></div><div class="week-foot"><span>Speso: ${money(week.spent)}</span><span>Budget: ${money(week.budget)}</span><span>${week.percentage.toFixed(0)}%</span></div></div>`).join('');

        const monthTabs = months.map((item, index) => `<button data-month-index="${index}" class="${index === state.monthIndex ? 'active' : ''}">${item.name.slice(0,3)}</button>`).join('');
        const expenses = month.expenses.length ? month.expenses.map((expense, index) => expenseRowHTML(expense, index)).join('') : '<p class="muted">Nessuna spesa registrata.</p>';

        document.getElementById('monthsPage').innerHTML = `
          <div class="month-tabs">${monthTabs}</div>
          <div class="card"><h2>${month.name} ${state.data.currentYear}</h2><div class="form-grid">
            <div class="field"><label>Stipendio</label><input id="salary" type="number" value="${number(month.stipendio)}"></div>
            <div class="field"><label>Entrate extra</label><input id="incomeExtra" type="number" value="${number(month.extra)}"></div>
            <div class="field"><label>Risparmio %</label><input id="savingPercent" type="number" value="${number(month.percent)}"></div>
            <div class="field"><label>${escapeHTML(state.data.fixedLabels.auto)}</label><input id="fixedAuto" type="number" value="${number(month.fisse.auto)}"></div>
            <div class="field"><label>${escapeHTML(state.data.fixedLabels.telefono)}</label><input id="fixedPhone" type="number" value="${number(month.fisse.telefono)}"></div>
            <div class="field"><label>${escapeHTML(state.data.fixedLabels.abbonamenti)}</label><input id="fixedSubscriptions" type="number" value="${number(month.fisse.abbonamenti)}"></div>
            <div class="field"><label>${escapeHTML(state.data.fixedLabels.viaggi)}</label><input id="travelSaving" type="number" value="${number(month.viaggi)}"></div>
            <div class="field"><label>${escapeHTML(state.data.fixedLabels.extra)}</label><input id="extraSaving" type="number" value="${number(month.speseExtra)}"></div>
          </div><button id="saveMonth" class="btn btn-primary" style="margin-top:12px">Salva configurazione</button></div>
          <div class="stats"><div class="stat"><small>Entrate</small><div class="stat-value">${money(calculation.income)}</div></div><div class="stat"><small>Budget settimanale</small><div class="stat-value">${money(calculation.weeklyBudget)}</div></div><div class="stat"><small>Spese variabili</small><div class="stat-value">${money(calculation.variableExpenses)}</div></div><div class="stat"><small>Risparmio reale</small><div class="stat-value ${calculation.realSaving >= 0 ? 'positive' : 'negative'}">${money(calculation.realSaving)}</div></div></div>
          <div class="card"><h2>Budget settimanale</h2><p class="muted">Viaggi ed extra non riducono questo budget: sono somme accantonate per obiettivi.</p>${weekRows}</div>
          <div class="card"><h2>Registro spese</h2><div class="expense-list">${expenses}</div></div>
        `;

        document.querySelectorAll('[data-month-index]').forEach(button => button.addEventListener('click', () => { state.monthIndex = Number(button.dataset.monthIndex); render(); }));
        document.getElementById('saveMonth').addEventListener('click', () => {
          month.stipendio = number(document.getElementById('salary').value);
          month.extra = number(document.getElementById('incomeExtra').value);
          month.percent = number(document.getElementById('savingPercent').value);
          month.fisse.auto = number(document.getElementById('fixedAuto').value);
          month.fisse.telefono = number(document.getElementById('fixedPhone').value);
          month.fisse.abbonamenti = number(document.getElementById('fixedSubscriptions').value);
          month.viaggi = number(document.getElementById('travelSaving').value);
          month.speseExtra = number(document.getElementById('extraSaving').value);
          saveData('Configurazione salvata');
          render();
        });

        bindExpenseEvents(month);
      }

      function expenseRowHTML(expense, index) {
        const categories = Object.keys(state.data.categories);
        const subcategories = state.data.categories[expense.cat] || [];
        const categoryOptions = categories.map(category => `<option value="${escapeHTML(category)}" ${category === expense.cat ? 'selected' : ''}>${escapeHTML(category)}</option>`).join('');
        const subcategoryOptions = subcategories.length ? subcategories.map(sub => `<option value="${escapeHTML(sub)}" ${sub === expense.subcat ? 'selected' : ''}>${escapeHTML(sub)}</option>`).join('') : '<option value="">Generale</option>';
        return `<div class="expense-row" data-expense-index="${index}">
          <input data-expense-field="date" type="date" value="${escapeHTML(expense.date)}">
          <input data-expense-field="desc" class="description" value="${escapeHTML(expense.desc || '')}" placeholder="Descrizione">
          <input data-expense-field="amount" type="number" step="0.01" value="${number(expense.amount)}">
          <button data-delete-expense class="expense-delete" aria-label="Elimina spesa">✕</button>
          <select data-expense-field="cat" class="expense-subcategory">${categoryOptions}</select>
          <select data-expense-field="subcat" class="expense-subcategory">${subcategoryOptions}</select>
        </div>`;
      }

      function bindExpenseEvents(month) {
        document.querySelectorAll('[data-expense-index]').forEach(row => {
          const index = Number(row.dataset.expenseIndex);
          row.querySelectorAll('[data-expense-field]').forEach(input => input.addEventListener('change', () => {
            const field = input.dataset.expenseField;
            if (field === 'amount') month.expenses[index].amount = number(input.value);
            else if (field === 'cat') {
              month.expenses[index].cat = input.value;
              month.expenses[index].subcat = null;
            } else if (field === 'subcat') month.expenses[index].subcat = input.value || null;
            else month.expenses[index][field] = input.value;
            saveData();
            render();
          }));
          row.querySelector('[data-delete-expense]').addEventListener('click', () => {
            month.expenses.splice(index, 1);
            saveData('Spesa eliminata');
            render();
          });
        });
      }

      function renderGoals() {
        const saved = accumulatedTargetSavings();
        const goalsHTML = state.data.goals.length ? state.data.goals.map((goal, index) => {
          const percentage = Math.min(100, goal.target > 0 ? number(goal.saved) / number(goal.target) * 100 : 0);
          return `<div class="goal-card"><div class="goal-head"><span class="goal-name">${escapeHTML(goal.name)}</span><span class="goal-amount">${money(goal.saved)} / ${money(goal.target)}</span></div><div class="goal-bar"><div class="goal-fill" style="width:${percentage}%"></div></div><div class="goal-foot"><span>${percentage.toFixed(0)}% completato</span><button data-delete-goal="${index}" class="btn btn-danger" style="min-height:28px;padding:3px 9px">Elimina</button></div></div>`;
        }).join('') : '<p class="muted">Nessun obiettivo impostato.</p>';

        document.getElementById('goalsPage').innerHTML = `<div class="card"><h2>Obiettivi di risparmio</h2><p class="muted">Gli obiettivi sono modificabili manualmente: in questo modo puoi assegnare a ciascun obiettivo la quota di risparmio che desideri.</p><div class="form-grid"><div class="field"><label>Nome</label><input id="goalName" placeholder="Es. Vacanza"></div><div class="field"><label>Target (€)</label><input id="goalTarget" type="number" step="0.01"></div><div class="field"><label>Già accantonato (€)</label><input id="goalSaved" type="number" step="0.01" value="0"></div></div><button id="addGoal" class="btn btn-primary" style="margin-top:12px">Aggiungi obiettivo</button></div><div class="card"><h2>Totale somme accantonate</h2><div class="stat-value" style="font-size:24px;color:var(--accent)">${money(saved)}</div><p class="muted">Somma di Spese viaggi, Spese extra e storico.</p></div><div class="card"><h2>I tuoi obiettivi</h2>${goalsHTML}</div>`;

        document.getElementById('addGoal').addEventListener('click', () => {
          const name = document.getElementById('goalName').value.trim();
          const target = number(document.getElementById('goalTarget').value);
          const savedValue = number(document.getElementById('goalSaved').value);
          if (!name || target <= 0) return showToast('Inserisci nome e target');
          state.data.goals.push({ name, target, saved: savedValue });
          saveData('Obiettivo aggiunto');
          render();
        });
        document.querySelectorAll('[data-delete-goal]').forEach(button => button.addEventListener('click', () => {
          state.data.goals.splice(Number(button.dataset.deleteGoal), 1);
          saveData('Obiettivo eliminato');
          render();
        }));
      }

      function renderTrends() {
        const categoryAverages = {};
        currentMonths().forEach(month => month.expenses.forEach(expense => {
          const category = expense.cat || 'Altro';
          if (!categoryAverages[category]) categoryAverages[category] = { total: 0, months: 0 };
          categoryAverages[category].total += number(expense.amount);
        }));
        Object.keys(categoryAverages).forEach(category => { categoryAverages[category].months = 12; });
        const trendRows = Object.entries(categoryAverages).map(([category, data]) => {
          const average = data.total / data.months;
          const current = currentMonths()[state.monthIndex].expenses.filter(expense => expense.cat === category).reduce((sum, expense) => sum + number(expense.amount), 0);
          const arrow = current > average ? '↑' : current < average ? '↓' : '→';
          const className = current > average ? 'negative' : current < average ? 'positive' : 'muted';
          return `<div class="trend-row"><span>${escapeHTML(category)}</span><span>${money(average)} <span class="${className}">${arrow}</span></span></div>`;
        }).join('') || '<p class="muted">Nessun dato sufficiente.</p>';
        const topSubcategories = subcategoryTotals().slice(0, 5).map(item => `<div class="trend-row"><span>${escapeHTML(item.name)}</span><span>${money(item.amount)}</span></div>`).join('') || '<p class="muted">Nessuna sotto-categoria registrata.</p>';

        document.getElementById('trendsPage').innerHTML = `<div class="card"><h2>Medie mensili per categoria</h2><p class="muted">La freccia confronta l’ultimo mese selezionato con la media annua.</p>${trendRows}</div><div class="card"><h2>Top 5 sotto-categorie</h2>${topSubcategories}</div><div class="card"><h2>Spese degli ultimi 3 mesi</h2><div class="chart"><canvas id="trendChart"></canvas></div></div>`;

        const labels = [0,1,2].map(offset => MONTHS[(state.monthIndex - offset + 12) % 12]);
        const values = [0,1,2].map(offset => {
          const month = currentMonths()[(state.monthIndex - offset + 12) % 12];
          return month.expenses.reduce((sum, expense) => sum + number(expense.amount), 0);
        }).reverse();
        state.charts.trend = new Chart(document.getElementById('trendChart'), { type: 'bar', data: { labels, datasets: [{ label: 'Spese', data: values, backgroundColor: '#4f6df5' }] }, options: chartOptions(chartColors()) });
      }

      function renderSettings() {
        const categoryText = Object.entries(state.data.categories).map(([category, subcategories]) => `${category}: ${subcategories.join(', ')}`).join('\n');
        document.getElementById('settingsPage').innerHTML = `<div class="card"><h2>Intestazioni spese mensili</h2><div class="form-grid"><div class="field"><label>Prima voce</label><input id="labelAuto" value="${escapeHTML(state.data.fixedLabels.auto)}"></div><div class="field"><label>Seconda voce</label><input id="labelPhone" value="${escapeHTML(state.data.fixedLabels.telefono)}"></div><div class="field"><label>Terza voce</label><input id="labelSubscriptions" value="${escapeHTML(state.data.fixedLabels.abbonamenti)}"></div><div class="field"><label>Quarta voce</label><input id="labelTravel" value="${escapeHTML(state.data.fixedLabels.viaggi)}"></div><div class="field"><label>Quinta voce</label><input id="labelExtra" value="${escapeHTML(state.data.fixedLabels.extra)}"></div></div><button id="saveLabels" class="btn btn-primary" style="margin-top:12px">Salva intestazioni</button></div><div class="card"><h2>Categorie e sotto-categorie</h2><p class="muted">Una riga per categoria, nel formato: Categoria: Sotto1, Sotto2</p><textarea id="categoryEditor">${escapeHTML(categoryText)}</textarea><button id="saveCategories" class="btn btn-primary" style="margin-top:12px">Salva categorie</button></div><div class="card"><h2>Aspetto</h2><p class="muted">Modalità</p><div class="actions"><button data-mode="light" class="btn ${state.data.theme.mode === 'light' ? 'btn-primary' : 'btn-secondary'}">☀️ Chiaro</button><button data-mode="dark" class="btn ${state.data.theme.mode === 'dark' ? 'btn-primary' : 'btn-secondary'}">🌙 Scuro</button><button data-mode="auto" class="btn ${state.data.theme.mode === 'auto' ? 'btn-primary' : 'btn-secondary'}">🔄 Auto</button></div><p class="muted" style="margin-top:14px">Colore principale</p><div class="actions">${['#4f6df5','#8da2ff','#168447','#d78619','#8d5cf6','#e0578f'].map(color => `<button data-accent="${color}" style="width:42px;height:42px;border:3px solid ${state.data.theme.accent === color ? 'var(--text)' : 'transparent'};border-radius:50%;background:${color}"></button>`).join('')}</div></div><div class="card"><h2>Backup</h2><div class="actions"><button id="exportJSON" class="btn btn-primary">Esporta JSON</button><button id="importJSON" class="btn btn-secondary">Importa JSON</button><input id="jsonFile" type="file" accept=".json" hidden></div></div>`;

        document.getElementById('saveLabels').addEventListener('click', () => {
          state.data.fixedLabels = { auto: valueOrDefault('labelAuto', DEFAULT_LABELS.auto), telefono: valueOrDefault('labelPhone', DEFAULT_LABELS.telefono), abbonamenti: valueOrDefault('labelSubscriptions', DEFAULT_LABELS.abbonamenti), viaggi: valueOrDefault('labelTravel', DEFAULT_LABELS.viaggi), extra: valueOrDefault('labelExtra', DEFAULT_LABELS.extra) };
          saveData('Intestazioni salvate'); render();
        });
        document.getElementById('saveCategories').addEventListener('click', () => {
          const categories = {};
          document.getElementById('categoryEditor').value.split('\n').forEach(line => {
            const separator = line.indexOf(':');
            if (separator < 0) return;
            const category = line.slice(0, separator).trim();
            const subs = line.slice(separator + 1).split(',').map(item => item.trim()).filter(Boolean);
            if (category) categories[category] = subs;
          });
          if (!Object.keys(categories).length) return showToast('Formato categorie non valido');
          state.data.categories = categories; saveData('Categorie salvate'); render();
        });
        document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { state.data.theme.mode = button.dataset.mode; applyTheme(); saveData(); render(); }));
        document.querySelectorAll('[data-accent]').forEach(button => button.addEventListener('click', () => { state.data.theme.accent = button.dataset.accent; applyTheme(); saveData(); render(); }));
        document.getElementById('exportJSON').addEventListener('click', () => download('gestione-risparmi.json', JSON.stringify(state.data, null, 2), 'application/json'));
        document.getElementById('importJSON').addEventListener('click', () => document.getElementById('jsonFile').click());
        document.getElementById('jsonFile').addEventListener('change', importJSONFile);
      }

      function valueOrDefault(id, fallback) {
        const value = document.getElementById(id).value.trim();
        return value || fallback;
      }

      /* =========================
         Import/export e tema
         ========================= */
      function download(filename, content, type) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([content], { type }));
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('File esportato');
      }

      function importJSONFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            state.data = normalizeData(JSON.parse(reader.result));
            applyTheme(); fillYearSelect(); render(); showToast('Importazione completata');
          } catch (error) { showToast('JSON non valido'); console.error(error); }
        };
        reader.readAsText(file);
      }

      function applyTheme() {
        const mode = state.data.theme.mode;
        const dark = mode === 'dark' || (mode === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.setProperty('--accent', state.data.theme.accent || '#4f6df5');
      }

      function fillYearSelect() {
        const years = Object.keys(state.data.years).map(Number).sort((a,b) => a-b);
        document.getElementById('yearSelect').innerHTML = years.map(year => `<option value="${year}" ${year === state.data.currentYear ? 'selected' : ''}>${year}</option>`).join('');
      }

      /* =========================
         Eventi globali
         ========================= */
      document.getElementById('navigation').addEventListener('click', event => {
        const button = event.target.closest('[data-page]');
        if (!button) return;
        state.page = button.dataset.page;
        render();
      });

      document.getElementById('yearSelect').addEventListener('change', event => {
        state.data.currentYear = Number(event.target.value);
        state.monthIndex = 0;
        saveData(); render();
      });

      document.getElementById('addYearButton').addEventListener('click', () => {
        const years = Object.keys(state.data.years).map(Number);
        const newYear = Math.max(...years) + 1;
        state.data.years[newYear] = createBlankYear();
        state.data.currentYear = newYear;
        saveData('Anno aggiunto'); fillYearSelect(); render();
      });

      document.getElementById('addExpenseButton').addEventListener('click', () => {
        const categorySelect = document.getElementById('newExpenseCategory');
        categorySelect.innerHTML = Object.keys(state.data.categories).map(category => `<option value="${escapeHTML(category)}">${escapeHTML(category)}</option>`).join('');
        updateNewExpenseSubcategories();
        document.getElementById('newExpenseDate').value = todayISO();
        document.getElementById('newExpenseDescription').value = '';
        document.getElementById('newExpenseAmount').value = '';
        document.getElementById('expenseModal').classList.add('open');
      });

      document.getElementById('closeExpenseModal').addEventListener('click', () => document.getElementById('expenseModal').classList.remove('open'));
      document.getElementById('newExpenseCategory').addEventListener('change', updateNewExpenseSubcategories);

      function updateNewExpenseSubcategories() {
        const category = document.getElementById('newExpenseCategory').value;
        const subcategories = state.data.categories[category] || [];
        document.getElementById('newExpenseSubcategory').innerHTML = subcategories.length ? subcategories.map(sub => `<option value="${escapeHTML(sub)}">${escapeHTML(sub)}</option>`).join('') : '<option value="">Generale</option>';
      }

      document.getElementById('saveNewExpense').addEventListener('click', () => {
        const date = document.getElementById('newExpenseDate').value;
        if (!date) return showToast('Inserisci una data');
        const dateObject = new Date(date + 'T00:00:00');
        const year = dateObject.getFullYear();
        const monthIndex = dateObject.getMonth();
        if (!state.data.years[year]) state.data.years[year] = createBlankYear();
        state.data.years[year].months[monthIndex].expenses.push({
          date,
          cat: document.getElementById('newExpenseCategory').value || 'Altro',
          subcat: document.getElementById('newExpenseSubcategory').value || null,
          desc: document.getElementById('newExpenseDescription').value.trim(),
          amount: number(document.getElementById('newExpenseAmount').value)
        });
        state.data.currentYear = year;
        state.monthIndex = monthIndex;
        document.getElementById('expenseModal').classList.remove('open');
        saveData('Spesa aggiunta'); fillYearSelect(); state.page = 'months'; render();
      });

      window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (state.data.theme.mode === 'auto') applyTheme();
      });

      /* =========================
         Avvio sicuro dell'app
         ========================= */
      state.data = loadData();
      applyTheme();
      fillYearSelect();
      render();
    })();
  </script>
</body>
</html>
