lid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}.tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 5px}.field input,.field select,.expense input,.expense select,.catinput{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.secondary{background:#eef1f7;color:var(--text)}.danger{background:#ffe8e9;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.expense{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.expense .wide{grid-column:1/-1}.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:110;width:56px;height:56px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:28px;box-shadow:0 5px 18px #4f6df555}.modal{display:none;position:fixed;inset:0;z-index:200;background:#17203388;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.hidden{display:none!important}.themes{display:flex;gap:10px;flex-wrap:wrap}.theme{width:42px;height:42px;border-radius:50%;border:3px solid transparent}.chart{height:240px}.history{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:430px){.top{padding:12px}.topin{align-items:flex-start}.brand{font-size:14px;padding-top:8px}.year select,.year button{font-size:12px;padding:8px}.nav{top:72px}.nav button{font-size:11px}.card{padding:14px}}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center}.sheet{width:500px;border-radius:20px}}

<body>
<header class="top"><div class="topin"><div class="brand">💰 Gestione Risparmi</div><div class="year"><select id="yearSelect"></select><button id="addYear">+ Anno</button></div></div></header>
<main><nav class="nav" id="nav"><button class="active" data-page="dashboard">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav><section id="dashboard"></section><section id="months" class="hidden"></section><section id="investments" class="hidden"></section><section id="settings" class="hidden"></section></main>
<button class="fab" id="fab">+</button><div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="nDate" type="date"></div><div class="field"><label>Categoria</label><select id="nCat"></select></div><div class="field"><label>Descrizione</label><input id="nDesc"></div><div class="field"><label>Importo</label><input id="nAmount" type="number" step=".01"></div><div class="actions"><button class="btn secondary" id="closeModal">Annulla</button><button class="btn primary" id="saveNew">Salva</button></div></div></div>
<script>
(function(){'use strict';
var MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],CATS=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'],KEY='gestione-risparmi-excel-v1';
function blank(){return MONTHS.map(function(name){return{name:name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]};});}
var seed={currentYear:2026,years:{2026:{months:blank()}},investments:{previous:0,years:{2026:{}}},historical:{},categories:CATS.slice(),theme:{accent:'#4f6df5',bg:'#f4f6fb'},excelImportato:false};MONTHS.forEach(function(m){seed.investments.years[2026][m]=0;});var DATA;try{DATA=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DATA=null}if(!DATA||!DATA.years)DATA=seed;if(!DATA.categories)DATA.categories=CATS.slice();if(!DATA.historical)DATA.historical={};if(!DATA.theme)DATA.theme=seed.theme;if(!DATA.investments)DATA.investments=seed.investments;if(!DATA.investments.years)DATA.investments.years={};if(!DATA.investments.years[DATA.currentYear])DATA.investments.years[DATA.currentYear]={};var page='dashboard',monthIndex=0,charts={};
function save(){localStorage.setItem(KEY,JSON.stringify(DATA))}function getMonths(){return DATA.years[DATA.currentYear].months}function money(n){return(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function calc(m){var income=(+m.stipendio||0)+(+m.extra||0),planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce(function(s,e){return s+(+e.amount||0)},0),travel=+m.viaggi||0,extra=+m.speseExtra||0;return{income:income,planned:planned,fixed:fixed,spent:spent,budget:income-planned-fixed,real:income-fixed-spent-travel-extra}}
function activate(name){page=name;['dashboard','months','investments','settings'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==name)});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===name)});render()}function render(){if(page==='dashboard')renderDashboard();if(page==='months')renderMonths();if(page==='investments')renderInvestments();if(page==='settings')renderSettings()}
function renderDashboard(){var total={income:0,planned:0,spent:0,real:0},rows='';getMonths().forEach(function(m){var c=calc(m);Object.keys(total).forEach(function(k){total[k]+=c[k]});rows+='<tr><td>'+m.name+'</td><td>'+money(c.income)+'</td><td>'+money(c.spent)+'</td><td class="'+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</td></tr>'});var old=Object.keys(DATA.historical).reduce(function(s,y){return s+(+DATA.historical[y]||0)},0);document.getElementById('dashboard').innerHTML='<div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(total.income)+'</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">'+money(total.planned)+'</div></div><div class="stat"><small>Spese variabili</small><div class="value">'+money(total.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(total.real>=0?'pos':'neg')+'">'+money(total.real)+'</div></div></div><div class="card"><h2>Entrate, spese e risparmio</h2><div class="chart"><canvas id="chartMain"></canvas></div></div><div class="card"><h2>Risparmio cumulato</h2><div class="chart"><canvas id="chartCum"></canvas></div></div><div class="card"><h2>Riepilogo '+DATA.currentYear+'</h2><div class="table"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h2>Risparmi degli anni precedenti</h2><p class="muted">Totale storico: '+money(old)+'</p><div id="historyRows"></div><div class="actions"><button class="btn secondary" id="addHistory">Aggiungi anno</button></div></div>';var labels=getMonths().map(function(m){return m.name.slice(0,3)}),cs=getMonths().map(calc),running=0;destroyCharts();charts.main=new Chart(document.getElementById('chartMain'),{type:'bar',data:{labels:labels,datasets:[{label:'Entrate',data:cs.map(function(c){return c.income}),backgroundColor:'#4f6df5'},{label:'Spese',data:cs.map(function(c){return c.fixed+c.spent}),backgroundColor:'#d63d47'},{label:'Risparmio reale',data:cs.map(function(c){return c.real}),backgroundColor:'#168447'}]},options:{responsive:true,maintainAspectRatio:false}});charts.cum=new Chart(document.getElementById('chartCum'),{type:'line',data:{labels:labels,datasets:[{label:'Cumulato',data:cs.map(function(c){return running+=c.real}),borderColor:'#8d5cf6',backgroundColor:'#8d5cf633',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});renderHistory();document.getElementById('addHistory').onclick=function(){var y=prompt('Anno precedente');if(y&&!Object.prototype.hasOwnProperty.call(DATA.historical,y)){DATA.historical[y]=0;save();render()}}}
function destroyCharts(){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy()});charts={}}
function renderHistory(){var box=document.getElementById('historyRows');if(!box)return;box.innerHTML=Object.keys(DATA.historical).sort().map(function(y){return'<div class="history"><b>'+y+'</b><input data-hist="'+y+'" type="number" step=".01" value="'+DATA.historical[y]+'"><button class="btn danger" data-delhist="'+y+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessun anno inserito.</p>';box.querySelectorAll('[data-hist]').forEach(function(i){i.onchange=function(){DATA.historical[i.dataset.hist]=+i.value||0;save();render()}});box.querySelectorAll('[data-delhist]').forEach(function(b){b.onclick=function(){delete DATA.historical[b.dataset.delhist];save();render()}})}
function renderMonths(){var m=getMonths()[monthIndex],c=calc(m);var tabs=getMonths().map(function(x,i){return'<button class="'+(i===monthIndex?'active':'')+'" data-mi="'+i+'">'+x.name.slice(0,3)+'</button>'}).join('');var ex=m.expenses.map(function(e,i){return'<div class="expense" data-ei="'+i+'"><input data-f="date" type="date" value="'+e.date+'"><select data-f="cat">'+DATA.categories.map(function(x){return'<option '+(x===e.cat?'selected':'')+'>'+x+'</option>'}).join('')+'</select><input class="wide" data-f="desc" value="'+String(e.desc||'').replace(/"/g,'&quot;')+'"><input data-f="amount" type="number" step=".01" value="'+(e.amount||0)+'"><button class="btn danger" data-delexp="'+i+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessuna spesa.</p>';document.getElementById('months').innerHTML='<div class="tabs">'+tabs+'</div><div class="card"><h2>'+m.name+' '+DATA.currentYear+'</h2><div class="form"><div class="field"><label>Stipendio</label><input id="salary" type="number" value="'+m.stipendio+'"></div><div class="field"><label>Entrate extra</label><input id="extra" type="number" value="'+m.extra+'"></div><div class="field"><label>Risparmio %</label><input id="percent" type="number" value="'+m.percent+'"></div><div class="field"><label>Auto</label><input id="auto" type="number" value="'+m.fisse.auto+'"></div><div class="field"><label>Telefono</label><input id="phone" type="number" value="'+m.fisse.telefono+'"></div><div class="field"><label>Abbonamenti</label><input id="subs" type="number" value="'+m.fisse.abbonamenti+'"></div><div class="field"><label>Spese viaggi</label><input id="travel" type="number" value="'+(m.viaggi||0)+'"></div><div class="field"><label>Spese extra</label><input id="other" type="number" value="'+(m.speseExtra||0)+'"></div></div><button class="btn primary" id="saveConfig">Salva configurazione</button></div><div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(c.income)+'</div></div><div class="stat"><small>Budget variabili</small><div class="value">'+money(c.budget)+'</div></div><div class="stat"><small>Spese</small><div class="value">'+money(c.spent)+'</div></div><div class="stat"><small>Reale</small><div class="value '+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</div></div></div><div class="card"><h2>Registro spese</h2>'+ex+'</div>';document.querySelectorAll('[data-mi]').forEach(function(b){b.onclick=function(){monthIndex=+b.dataset.mi;render()}});document.getElementById('saveConfig').onclick=function(){m.stipendio=+salary.value||0;m.extra=+extra.value||0;m.percent=+percent.value||0;m.fisse.auto=+auto.value||0;m.fisse.telefono=+phone.value||0;m.fisse.abbonamenti=+subs.value||0;m.viaggi=+travel.value||0;m.speseExtra=+other.value||0;save();render()};document.querySelectorAll('[data-ei]').forEach(function(row){var i=+row.dataset.ei;row.querySelectorAll('[data-f]').forEach(function(input){input.onchange=function(){var f=input.dataset.f;if(f==='date')m.expenses[i].date=input.value;if(f==='cat')m.expenses[i].cat=input.value;if(f==='desc')m.expenses[i].desc=input.value;if(f==='amount')m.expenses[i].amount=+input.value||0;save()}})});document.querySelectorAll('[data-delexp]').forEach(function(b){b.onclick=function(){m.expenses.splice(+b.dataset.delexp,1);save();render()}})}
function renderInvestments(){var av=DATA.investments.years[DATA.currentYear]||{},running=Number(DATA.investments.previous)||0,cum=MONTHS.map(function(m){running+=Number(av[m]||0);return running});document.getElementById('investments').innerHTML='<div class="card"><h2>Investimenti</h2><div class="field"><label>Totale anni precedenti</label><input id="previous" type="number" value="'+(DATA.investments.previous||0)+'"></div><button class="btn primary" id="savePrevious">Salva</button></div><div class="card"><h2>Investimenti accumulati</h2><div class="chart"><canvas id="chartInvestments"></canvas></div><p class="muted">Totale attuale: '+money(cum[cum.length-1]||0)+'</p></div><div class="card"><h2>Investimenti mensili '+DATA.currentYear+'</h2>'+MONTHS.map(function(m){return'<div class="expense"><b>'+m+'</b><input data-invest="'+m+'" type="number" step=".01" value="'+(av[m]||0)+'"></div>'}).join('')+'</div>';if(window.__investmentChart)window.__investmentChart.destroy();window.__investmentChart=new Chart(document.getElementById('chartInvestments'),{type:'line',data:{labels:MONTHS.map(function(m){return m.slice(0,3)}),datasets:[{label:'Investimenti accumulati',data:cum,borderColor:'#f59e0b',backgroundColor:'#f59e0b33',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});document.getElementById('savePrevious').onclick=function(){DATA.investments.previous=+document.getElementById('previous').value||0;save();render()};document.querySelectorAll('[data-invest]').forEach(function(i){i.onchange=function(){av[i.dataset.invest]=+i.value||0;DATA.investments.years[DATA.currentYear]=av;save();render()}})}
function renderSettings(){document.getElementById('settings').innerHTML='<div class="card"><h2>Importazione iniziale</h2><p class="muted">Importa i fogli Configurazione, Spese e Investimenti.</p><label class="btn primary">Importa Excel iniziale<input id="excelFile" type="file" accept=".xlsx,.xls" hidden></label></div><div class="card"><h2>Temi</h2><div class="form"><div class="field"><label>Colore principale</label><input id="accent" type="color" value="'+DATA.theme.accent+'"></div><div class="field"><label>Sfondo</label><input id="bg" type="color" value="'+DATA.theme.bg+'"></div></div><div class="themes"><button class="theme" data-accent="#4f6df5" data-bg="#f4f6fb" style="background:#4f6df5"></button><button class="theme" data-accent="#8da2ff" data-bg="#151a26" style="background:#151a26"></button><button class="theme" data-accent="#168447" data-bg="#edf8f0" style="background:#168447"></button><button class="theme" data-accent="#d78619" data-bg="#fff7e8" style="background:#d78619"></button><button class="theme" data-accent="#8d5cf6" data-bg="#f5efff" style="background:#8d5cf6"></button></div></div><div class="card"><h2>Backup manuale</h2><div class="actions"><button class="btn primary" id="exportJson">Esporta JSON</button><button class="btn secondary" id="exportExcel">Esporta Excel</button><button class="btn secondary" id="importJson">Importa JSON</button><input id="fileJson" type="file" accept=".json" hidden></div></div>';document.getElementById('excelFile').onchange=importExcel;document.getElementById('accent').oninput=function(e){DATA.theme.accent=e.target.value;apply();save()};document.getElementById('bg').oninput=function(e){DATA.theme.bg=e.target.value;apply();save()};document.querySelectorAll('[data-accent]').forEach(function(b){b.onclick=function(){DATA.theme.accent=b.dataset.accent;DATA.theme.bg=b.dataset.bg;apply();save();render()}});document.getElementById('exportJson').onclick=function(){download('gestione-risparmi.json',JSON.stringify(DATA,null,2),'application/json')};document.getElementById('exportExcel').onclick=exportCompatibleXlsx;document.getElementById('importJson').onclick=function(){document.getElementById('fileJson').click()};document.getElementById('fileJson').onchange=function(e){var r=new FileReader();r.onload=function(){DATA=JSON.parse(r.result);save();apply();fillYears();render()};r.readAsText(e.target.files[0])}}
function normalizeDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}var s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var p=s.split(/[\/.-]/);if(p.length===3)return(p[2].length===2?'20'+p[2]:p[2])+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');return null}
function importExcel(e){var file=e.target.files[0];if(!file)return;if(DATA.excelImportato&&!confirm('Sostituire i dati attuali?'))return;var r=new FileReader();r.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),cfg=wb.Sheets.Configurazione,sp=wb.Sheets.Spese,inv=wb.Sheets.Investimenti;if(!cfg||!sp)throw Error('Fogli mancanti');var next={currentYear:2026,years:{},investments:{previous:0,years:{}},historical:DATA.historical||{},categories:DATA.categories||CATS.slice(),theme:DATA.theme,excelImportato:true};XLSX.utils.sheet_to_json(cfg,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),ix=MONTHS.indexOf(mn);if(!y||ix<0)return;if(!next.years[y])next.years[y]={months:blank()};var m=next.years[y].months[ix];m.stipendio=+row.Stipendio||0;m.extra=+row['Entrate extra']||0;m.percent=+row['Risparmio %']||0;m.fisse.auto=+row.Auto||0;m.fisse.telefono=+row.Telefono||0;m.fisse.abbonamenti=+row.Abbonamenti||0;m.viaggi=+row['Spese viaggi']||0;m.speseExtra=+row['Spese extra']||0});XLSX.utils.sheet_to_json(sp,{defval:''}).forEach(function(row){var d=normalizeDate(row.Data),cat=String(row.Categoria||'').trim(),amount=+row.Importo||0;if(!d||!cat||amount<=0)return;var dt=new Date(d+'T00:00:00'),y=dt.getFullYear(),ix=dt.getMonth();if(!next.years[y])next.years[y]={months:blank()};if(next.categories.indexOf(cat)<0)next.categories.push(cat);next.years[y].months[ix].expenses.push({date:d,cat:cat,desc:String(row.Descrizione||''),amount:amount})});if(inv)XLSX.utils.sheet_to_json(inv,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),v=+row.Importo||0;if(mn==='Anni precedenti')next.investments.previous=v;else if(y&&MONTHS.indexOf(mn)>=0){if(!next.investments.years[y])next.investments.years[y]={};next.investments.years[y][mn]=v}});next.currentYear=+Object.keys(next.years).sort()[0];DATA=next;save();fillYears();apply();activate('dashboard');alert('Importazione completata')}catch(err){alert('Errore importazione: '+err.message)}};r.readAsArrayBuffer(file)}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}function exportCompatibleXlsx(){var wb=XLSX.utils.book_new(),cfg=[['Anno','Mese','Stipendio','Entrate extra','Risparmio %','Auto','Telefono','Abbonamenti','Spese viaggi','Spese extra']];Object.keys(DATA.years).sort().forEach(function(y){DATA.years[y].months.forEach(function(m){cfg.push([+y,m.name,m.stipendio,m.extra,m.percent,m.fisse.auto,m.fisse.telefono,m.fisse.abbonamenti,m.viaggi||0,m.speseExtra||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cfg),'Configurazione');var sp=[['Data','Categoria','Descrizione','Importo']];Object.values(DATA.years).forEach(function(y){y.months.forEach(function(m){m.expenses.forEach(function(e){sp.push([e.date,e.cat,e.desc,e.amount])})})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sp),'Spese');var inv=[['Anno','Mese','Importo'],[2025,'Anni precedenti',DATA.investments.previous||0]];Object.keys(DATA.investments.years).sort().forEach(function(y){Object.keys(DATA.investments.years[y]).forEach(function(m){inv.push([+y,m,DATA.investments.years[y][m]||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(inv),'Investimenti');XLSX.writeFile(wb,'gestione-risparmi-esportazione.xlsx')}function apply(){document.documentElement.style.setProperty('--a',DATA.theme.accent);document.documentElement.style.setProperty('--bg',DATA.theme.bg)}function fillYears(){document.getElementById('yearSelect').innerHTML=Object.keys(DATA.years).sort().map(function(y){return'<option value="'+y+'" '+(+y===DATA.currentYear?'selected':'')+'>'+y+'</option>'}).join('')}document.getElementById('nav').onclick=function(e){var b=e.target.closest('button[data-page]');if(b)activate(b.dataset.page)};document.getElementById('yearSelect').onchange=function(e){DATA.currentYear=+e.target.value;monthIndex=0;save();render()};document.getElementById('addYear').onclick=function(){var y=Math.max.apply(null,Object.keys(DATA.years).map(Number))+1;DATA.years[y]={months:blank()};DATA.investments.years[y]={};DATA.currentYear=y;save();fillYears();render()};document.getElementById('fab').onclick=function(){document.getElementById('nDate').value=new Date().toISOString().slice(0,10);document.getElementById('nCat').innerHTML=DATA.categories.map(function(c){return'<option>'+c+'</option>'}).join('');document.getElementById('modal').classList.add('open')};document.getElementById('closeModal').onclick=function(){document.getElementById('modal').classList.remove('open')};document.getElementById('saveNew').onclick=function(){var d=document.getElementById('nDate').value,ix=new Date(d+'T00:00:00').getMonth();getMonths()[ix].expenses.push({date:d,cat:document.getElementById('nCat').value,desc:document.getElementById('nDesc').value,amount:+document.getElementById('nAmount').value||0});save();document.getElementById('modal').classList.remove('open');monthIndex=ix;activate('months')};apply();fillYears();activate('dashboard');})();
