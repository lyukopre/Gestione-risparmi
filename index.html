<style>
:root{--bg:#f5f6fa;--card:#ffffff;--text:#1f2430;--muted:#6b7280;--accent:#4f6df5;--green:#1f9d55;--red:#e0463e;--border:#e6e8ee;--radius:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--border);padding:calc(12px + var(--sat)) 20px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;font-weight:700}
.header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.year-switch{display:flex;align-items:center;gap:6px}
.year-switch select{width:auto;min-width:90px;padding:6px 8px;min-height:36px;font-size:14px}
.year-switch button{padding:6px 10px;min-height:36px;font-size:16px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;min-height:40px}
nav button.active{background:var(--accent);color:#fff}
main{padding:18px;max-width:1180px;margin:0 auto;padding-bottom:calc(90px + var(--sab))}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--border);margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:16px;font-weight:700}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.grid.cols-4,.grid.cols-2{grid-template-columns:1fr}}
@media(max-width:480px){main{padding:12px;padding-bottom:calc(90px + var(--sab))}}
.stat{background:var(--bg);border-radius:12px;padding:14px 16px}
.stat .label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .value{font-size:20px;font-weight:700;margin-top:4px;word-break:break-word}
.pos{color:var(--green)}.neg{color:var(--red)}
