<!-- Versione corretta completa: mantiene la UI mobile, ripristina export JSON/XLSX e temi. -->
<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f6df5"><title>Gestione Risparmi</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>:root{--a:#4f6df5;--bg:#f4f6fb;--card:#fff;--text:#182235;--muted:#697386;--line:#e3e7ef;--green:#168447;--red:#d63d47}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.top{position:relative;background:var(--card);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 14px 12px}.topin{max-width:760px;margin:auto;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:800}.year{display:flex;gap:5px}.year select,.year button{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card)}.year button,.primary{background:var(--a)!important;color:#fff!important}main{max-width:760px;margin:auto;padding:12px 14px}.nav{margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:8px 2px;font-size:11px}.nav button.active{background:#e9edff;color:var(--a);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px #1822350b}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--bg);border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted);font-size:10px}.value{font-size:17px;font-weight:800;margin-top:4px}.pos{color:var(--green)}.neg{color:var(--red)}h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.chart{height:195px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:0}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;color:var(--a)}.tabs button.active{background:var(--a);color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.expense input,.expense select,.catinput{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;min-height:42px}.secondary{background:#eef1f7;color:var(--text)}.danger{background:#ffe8e9;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1 1 130px}.expense{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}.expense .wide{grid-column:1/-1}.hidden{display:none!important}.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:100;width:52px;height:52px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:25px}.modal{display:none;position:fixed;inset:0;z-index:200;background:#17203388;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px}.themes{display:flex;gap:8px;flex-wrap:wrap}.theme{width:40px;height:40px;border-radius:50%;border:3px solid transparent}@media(max-width:520px){.form{grid-template-columns:1fr}.card{padding:13px}.chart{height:185px}}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center}.sheet{width:500px;border-radius:20px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">💰 Gestione Risparmi</div><div class="year"><select id="yearSelect"></select><button id="addYear">+ Anno</button></div></div></header><main><nav class="nav" id="nav"><button class="active" data-page="dashboard">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav><section id="dashboard"></section><section id="months" class="hidden"></section><section id="investments" class="hidden"></section><section id="settings" class="hidden"></section></main><button class="fab" id="fab">+</button><div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="nDate" type="date"></div><div class="field"><label>Categoria</label><select id="nCat"></select></div><div class="field"><label>Descrizione</label><input id="nDesc"></div><div class="field"><label>Importo</label><input id="nAmount" type="number" step=".01"></div><div class="actions"><button class="btn secondary" id="closeModal">Annulla</button><button class="btn primary" id="saveNew">Salva</button></div></div></div><script>
(function(){'use strict';var MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],CATS=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'],KEY='gestione-risparmi-excel-v1';function blank(){return MONTHS.map(function(name){return{name:name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]}})}var seed={currentYear:2026,years:{2026:{months:blank()}},investments:{previous:0,years:{2026:{}}},historical:{},categories:CATS.slice(),theme:{accent:'#4f6df5',bg:'#f4f6fb'},excelImportato:false};MONTHS.forEach(function(m){seed.investments.years[2026][m]=0});var DATA;try{DATA=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DATA=null}if(!DATA||!DATA.years)DATA=seed;if(!DATA.categories)DATA.categories=CATS.slice();if(!DATA.historical)DATA.historical={};if(!DATA.theme)DATA.theme=seed.theme;if(!DATA.investments)DATA.investments=seed.investments;if(!DATA.investments.years)DATA.investments.years={};if(!DATA.investments.years[DATA.currentYear])DATA.investments.years[DATA.currentYear]={};var page='dashboard',monthIndex=0,charts={};function save(){localStorage.setItem(KEY,JSON.stringify(DATA))}function getMonths(){return DATA.years[DATA.currentYear].months}function money(n){return(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function calc(m){var income=(+m.stipendio||0)+(+m.extra||0),planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce(function(s,e){return s+(+e.amount||0)},0),travel=+m.viaggi||0,extra=+m.speseExtra||0;return{income:income,planned:planned,fixed:fixed,spent:spent,budget:income-planned-fixed,real:income-fixed-spent-travel-extra}}function apply(){document.documentElement.style.setProperty('--a',DATA.theme.accent);document.documentElement.style.setProperty('--bg',DATA.theme.bg)}function activate(n){page=n;['dashboard','months','investments','settings'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==n)});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===n)});render()}function render(){if(page==='dashboard')renderDashboard();if(page==='months')renderMonths();if(page==='investments')renderInvestments();if(page==='settings')renderSettings()}function destroy(){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy()});charts={}}
function renderDashboard(){var t={income:0,planned:0,spent:0,real:0},rows='';getMonths().forEach(function(m){var c=calc(m);Object.keys(t).forEach(function(k){t[k]+=c[k]});rows+='<tr><td>'+m.name+'</td><td>'+money(c.income)+'</td><td>'+money(c.spent)+'</td><td class="'+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</td></tr>'});document.getElementById('dashboard').innerHTML='<div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(t.income)+'</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">'+money(t.planned)+'</div></div><div class="stat"><small>Spese variabili</small><div class="value">'+money(t.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(t.real>=0?'pos':'neg')+'">'+money(t.real)+'</div></div></div><div class="card"><h2>Riepilogo '+DATA.currentYear+'</h2><div class="table"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Reale</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'}
function renderMonths(){var m=getMonths()[monthIndex],c=calc(m),ex=m.expenses.map(function(e,i){return'<div class="expense"><input data-ei="'+i+'" data-f="date" type="date" value="'+e.date+'"><select data-ei="'+i+'" data-f="cat">'+DATA.categories.map(function(x){return'<option '+(x===e.cat?'selected':'')+'>'+x+'</option>'}).join('')+'</select><input class="wide" data-ei="'+i+'" data-f="desc" value="'+String(e.desc||'').replace(/"/g,'&quot;')+'"><input data-ei="'+i+'" data-f="amount" type="number" step=".01" value="'+(e.amount||0)+'"><button class="btn danger" data-del="'+i+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessuna spesa.</p>';document.getElementById('months').innerHTML='<div class="tabs">'+getMonths().map(function(x,i){return'<button class="'+(i===monthIndex?'active':'')+'" data-mi="'+i+'">'+x.name.slice(0,3)+'</button>'}).join('')+'</div><div class="card"><h2>'+m.name+' '+DATA.currentYear+'</h2><div class="form"><div class="field"><label>Stipendio</label><input id="salary" type="number" value="'+m.stipendio+'"></div><div class="field"><label>Entrate extra</label><input id="extra" type="number" value="'+m.extra+'"></div><div class="field"><label>Risparmio %</label><input id="percent" type="number" value="'+m.percent+'"></div><div class="field"><label>Auto</label><input id="auto" type="number" value="'+m.fisse.auto+'"></div><div class="field"><label>Telefono</label><input id="phone" type="number" value="'+m.fisse.telefono+'"></div><div class="field"><label>Abbonamenti</label><input id="subs" type="number" value="'+m.fisse.abbonamenti+'"></div></div><button class="btn primary" id="saveConfig">Salva configurazione</button></div><div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(c.income)+'</div></div><div class="stat"><small>Budget variabili</small><div class="value">'+money(c.budget)+'</div></div><div class="stat"><small>Spese</small><div class="value">'+money(c.spent)+'</div></div><div class="stat"><small>Reale</small><div class="value '+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</div></div></div><div class="card"><h2>Registro spese</h2>'+ex+'</div>';document.querySelectorAll('[data-mi]').forEach(function(b){b.onclick=function(){monthIndex=+b.dataset.mi;render()}});document.getElementById('saveConfig').onclick=function(){m.stipendio=+salary.value||0;m.extra=+extra.value||0;m.percent=+percent.value||0;m.fisse.auto=+auto.value||0;m.fisse.telefono=+phone.value||0;m.fisse.abbonamenti=+subs.value||0;save();render()};document.querySelectorAll('[data-f]').forEach(function(i){i.onchange=function(){var e=m.expenses[+i.dataset.ei],f=i.dataset.f;if(f==='date')e.date=i.value;if(f==='cat')e.cat=i.value;if(f==='desc')e.desc=i.value;if(f==='amount')e.amount=+i.value||0;save()}});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){m.expenses.splice(+b.dataset.del,1);save();render()}})}
function renderInvestments(){var years=Object.keys(DATA.investments.years).map(Number).sort(function(a,b){return a-b}),labels=['Anni precedenti'],values=[+DATA.investments.previous||0],run=values[0];years.forEach(function(y){MONTHS.forEach(function(m){run+=(DATA.investments.years[y]||{})[m]||0;labels.push(y+' '+m.slice(0,3));values.push(run)})});var av=DATA.investments.years[DATA.currentYear]||{};document.getElementById('investments').innerHTML='<div class="card"><h2>Investimenti cumulati</h2><div class="chart"><canvas id="investmentChart"></canvas></div><p class="muted">Totale complessivo: '+money(run)+'</p></div><div class="card"><h2>Investimenti mensili '+DATA.currentYear+'</h2>'+MONTHS.map(function(m){return'<div class="expense"><b>'+m+'</b><input data-inv="'+m+'" type="number" value="'+(av[m]||0)+'"></div>'}).join('')+'</div>';if(window.invChart)window.invChart.destroy();window.invChart=new Chart(document.getElementById('investmentChart'),{type:'line',data:{labels:labels,datasets:[{label:'Totale cumulato',data:values,borderColor:'#f59e0b',backgroundColor:'#f59e0b33',fill:true}]},options:{responsive:true,maintainAspectRatio:false}});document.querySelectorAll('[data-inv]').forEach(function(i){i.onchange=function(){av[i.dataset.inv]=+i.value||0;DATA.investments.years[DATA.currentYear]=av;save();render()}})}
function renderSettings(){document.getElementById('settings').innerHTML='<div class="card"><h2>Temi e colori</h2><div class="form"><div class="field"><label>Colore principale</label><input id="accent" type="color" value="'+DATA.theme.accent+'"></div><div class="field"><label>Sfondo</label><input id="bg" type="color" value="'+DATA.theme.bg+'"></div></div><div class="themes"><button class="theme" data-ac="#4f6df5" data-bg="#f4f6fb" style="background:#4f6df5"></button><button class="theme" data-ac="#168447" data-bg="#edf8f0" style="background:#168447"></button><button class="theme" data-ac="#8d5cf6" data-bg="#f5efff" style="background:#8d5cf6"></button></div></div><div class="card"><h2>Backup</h2><div class="actions"><button class="btn primary" id="jsonOut">Esporta JSON</button><button class="btn secondary" id="xlsxOut">Esporta Excel</button></div></div>';document.getElementById('accent').oninput=function(e){DATA.theme.accent=e.target.value;apply();save()};document.getElementById('bg').oninput=function(e){DATA.theme.bg=e.target.value;apply();save()};document.querySelectorAll('[data-ac]').forEach(function(b){b.onclick=function(){DATA.theme.accent=b.dataset.ac;DATA.theme.bg=b.dataset.bg;apply();save();render()}});document.getElementById('jsonOut').onclick=function(){download('gestione-risparmi.json',JSON.stringify(DATA,null,2),'application/json')};document.getElementById('xlsxOut').onclick=exportXlsx}
function download(n,t,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:type}));a.download=n;a.click()}function exportXlsx(){var wb=XLSX.utils.book_new(),cfg=[['Anno','Mese','Stipendio','Entrate extra','Risparmio %','Auto','Telefono','Abbonamenti','Spese viaggi','Spese extra']];Object.keys(DATA.years).sort().forEach(function(y){DATA.years[y].months.forEach(function(m){cfg.push([+y,m.name,m.stipendio,m.extra,m.percent,m.fisse.auto,m.fisse.telefono,m.fisse.abbonamenti,m.viaggi||0,m.speseExtra||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cfg),'Configurazione');var sp=[['Data','Categoria','Descrizione','Importo']];Object.values(DATA.years).forEach(function(y){y.months.forEach(function(m){m.expenses.forEach(function(e){sp.push([e.date,e.cat,e.desc,e.amount])})})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sp),'Spese');XLSX.writeFile(wb,'backup-risparmi.xlsx')}function fillYears(){yearSelect.innerHTML=Object.keys(DATA.years).sort().map(function(y){return'<option '+(+y===DATA.currentYear?'selected':'')+'>'+y+'</option>'}).join('')}nav.onclick=function(e){var b=e.target.closest('button[data-page]');if(b)activate(b.dataset.page)};yearSelect.onchange=function(e){DATA.currentYear=+e.target.value;save();render()};addYear.onclick=function(){var y=Math.max.apply(null,Object.keys(DATA.years).map(Number))+1;DATA.years[y]={months:blank()};DATA.currentYear=y;save();fillYears();render()};fab.onclick=function(){nDate.value=new Date().toISOString().slice(0,10);nCat.innerHTML=DATA.categories.map(function(c){return'<option>'+c+'</option>'}).join('');modal.classList.add('open')};closeModal.onclick=function(){modal.classList.remove('open')};saveNew.onclick=function(){var d=nDate.value,ix=new Date(d+'T00:00:00').getMonth();getMonths()[ix].expenses.push({date:d,cat:nCat.value,desc:nDesc.value,amount:+nAmount.value||0});save();modal.classList.remove('open');activate('months')};apply();fillYears();activate('dashboard')})();
</script></body></html>
