<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f6df5"><title>Gestione Risparmi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--a:#4f6df5;--bg:#f4f6fb;--card:#fff;--text:#182235;--muted:#697386;--line:#e3e7ef;--green:#168447;--red:#d63d47;--yellow:#c98a12;--safe:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--text:#eef1f7;--muted:#9aa3b8;--line:#2c3140;--green:#39d17f;--red:#ff6b6b;--yellow:#e8b64a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(96px + var(--safe));overflow-x:hidden;transition:background .2s,color .2s;-webkit-text-size-adjust:100%}
.top{position:relative;background:var(--card);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 14px 12px}
.topin{max-width:760px;margin:auto;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:800;font-size:16px}
.year{display:flex;gap:5px}
.year select,.year button{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--text);font-size:14px;min-height:40px}
.year button,.primary{background:var(--a)!important;border-color:var(--a)!important;color:#fff!important}
main{max-width:760px;margin:auto;padding:12px 14px 24px}
.nav{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:12px 4px;font-size:12.5px;line-height:1.35;min-height:52px;touch-action:manipulation}
.nav button.active{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.045)}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:11px}
.stat small{display:block;color:var(--muted);font-size:10px}
.value{font-size:17px;font-weight:800;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}
.chart{height:195px}
.chart.donut{height:220px}
.table{overflow:auto}
.table table{width:100%;border-collapse:collapse;min-width:0}
.table th,.table td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px}
.table th{color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 18px;color:var(--a);font-size:14px;font-weight:600;min-height:46px;touch-action:manipulation}
.tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}
.pill-tabs{display:flex;gap:6px;margin-bottom:12px}
.pill-tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600}
.pill-tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 5px}
.field input,.field select,.catinput{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--text);font:inherit;font-size:16px;min-height:44px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;min-height:46px;cursor:pointer;touch-action:manipulation}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.danger{background:#ffe8e9;color:var(--red)}
[data-theme="dark"] .danger{background:#3a1f22;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 130px;text-align:center}
.expense-list{border-top:1px solid var(--line)}
.expense{display:grid;grid-template-columns:82px 1fr 66px 26px;gap:5px;padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.expense input,.expense select{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 5px;background:var(--card);color:var(--text);font-size:11.5px;min-height:28px}
.expense .wide{grid-column:2}
.expense .btn.danger{padding:0;font-size:13px;min-height:26px;height:26px;width:26px;line-height:26px;text-align:center;border-radius:6px}
@media(max-width:380px){.expense{grid-template-columns:1fr 1fr;gap:4px;padding:7px 0}.expense .wide{grid-column:1/-1}.expense .btn.danger{grid-column:1/-1;justify-self:end;width:auto;height:auto;padding:4px 9px}}
.hidden{display:none!important}
.fab{position:fixed;right:16px;bottom:calc(88px + var(--safe));z-index:100;width:56px;height:56px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:27px;box-shadow:0 5px 18px rgba(0,0,0,.28);cursor:pointer;touch-action:manipulation}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);align-items:flex-end}
.modal.open{display:flex}
.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe))}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;touch-action:manipulation}
.theme.active{border-color:var(--text)}
.mode-toggle{display:flex;gap:8px;flex-wrap:wrap}
.mode-toggle button{flex:1 1 90px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:12px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:46px;touch-action:manipulation}
.mode-toggle button.active{background:var(--a);border-color:var(--a);color:#fff}
.settings-grid{display:grid;gap:14px}
.settings-card{margin:0}
.history{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.invyear{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.invyear select{flex:1}
.week-row{padding:10px 0;border-bottom:1px solid var(--line)}
.week-row:last-child{border-bottom:0}
.week-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px;gap:8px}
.week-head b{font-size:13.5px}
.week-badge{font-weight:800;font-size:13px;flex-shrink:0}
.week-bar-bg{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.week-bar-fill{height:100%;border-radius:6px;transition:width .3s ease}
.week-foot{display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.catlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.catrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.catrow .catdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.catrow .catname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .catval{font-weight:700;flex-shrink:0}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(18px + var(--safe));z-index:300;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;display:flex;align-items:center;gap:6px}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:520px){.form{grid-template-columns:1fr}.card{padding:13px}.chart{height:185px}.brand{font-size:14px}.year select,.year button{font-size:13px;padding:9px}.history{grid-template-columns:1fr 1fr}.history .btn{grid-column:1/-1}}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}body{padding-bottom:30px}.fab{bottom:24px}.modal{align-items:center;justify-content:center}.sheet{width:500px;border-radius:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">💰 Gestione Risparmi</div><div class="year"><select id="yearSelect"></select><button id="addYear">+ Anno</button></div></div></header>
<main><nav class="nav" id="nav"><button class="active" data-page="dashboard">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav><section id="dashboard"></section><section id="months" class="hidden"></section><section id="investments" class="hidden"></section><section id="settings" class="hidden"></section></main>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="nDate" type="date"></div><div class="field"><label>Categoria</label><select id="nCat"></select></div><div class="field"><label>Descrizione</label><input id="nDesc"></div><div class="field"><label>Importo</label><input id="nAmount" type="number" step=".01"></div><div class="actions"><button class="btn secondary" id="closeModal">Annulla</button><button class="btn primary" id="saveNew">Salva</button></div></div></div>
<div class="toast-wrap"><div class="toast" id="toast">✓ <span id="toastMsg">Salvato</span></div></div>
<script>
(function(){'use strict';
var MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],
CATS=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'],
KEY='gestione-risparmi-excel-v1',
ACCENTS=['#4f6df5','#8da2ff','#168447','#d78619','#8d5cf6','#e0578f'],
CATCOLORS=['#4f6df5','#d63d47','#168447','#d78619','#8d5cf6','#e0578f','#16a3b8','#9aa3b8','#c98a12','#39d17f','#ff6b6b','#6c5ce7'];
function blank(){return MONTHS.map(function(name){return{name:name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]}})}
var seed={currentYear:2026,years:{2026:{months:blank()}},investments:{previous:0,years:{2025:{},2026:{}}},historical:{},categories:CATS.slice(),theme:{accent:'#4f6df5',mode:'light'},excelImportato:false};
MONTHS.forEach(function(m){seed.investments.years[2025][m]=0;seed.investments.years[2026][m]=0});
var DATA;try{DATA=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DATA=null}
if(!DATA||!DATA.years)DATA=seed;
if(!DATA.categories)DATA.categories=CATS.slice();
if(!DATA.historical)DATA.historical={};
if(!DATA.theme)DATA.theme=seed.theme;
if(!DATA.theme.accent)DATA.theme.accent='#4f6df5';
if(!DATA.theme.mode)DATA.theme.mode='light';
if(!DATA.investments)DATA.investments=seed.investments;
if(!DATA.investments.years)DATA.investments.years={};
if(!DATA.investments.years[DATA.currentYear])DATA.investments.years[DATA.currentYear]={};
if(!DATA.investments.years[2025])DATA.investments.years[2025]={};
var page='dashboard',monthIndex=0,invYear=DATA.currentYear,dashCatScope='year',charts={},toastTimer=null;
function save(showToast){localStorage.setItem(KEY,JSON.stringify(DATA));if(showToast!==false)notify('Salvato')}
function notify(msg){var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1600)}
function getMonths(){return DATA.years[DATA.currentYear].months}
function money(n){return(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function calc(m){var income=(+m.stipendio||0)+(+m.extra||0),planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce(function(s,e){return s+(+e.amount||0)},0),travel=+m.viaggi||0,extra=+m.speseExtra||0;return{income:income,planned:planned,fixed:fixed,spent:spent,budget:income-planned-fixed,real:income-fixed-spent-travel-extra}}
function sortExpenses(m){m.expenses.sort(function(a,b){if(a.date>b.date)return -1;if(a.date<b.date)return 1;return 0})}
function fmtDayMonth(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function getMonthWeeks(year,mIdx){var first=new Date(year,mIdx,1),last=new Date(year,mIdx+1,0);var weeks=[],cur=new Date(first);while(cur<=last){var day=cur.getDay(),offset=day===0?6:day-1;var wStart=new Date(cur);wStart.setDate(cur.getDate()-offset);var wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+6);var clipStart=wStart<first?first:wStart,clipEnd=wEnd>last?last:wEnd;var days=Math.round((clipEnd-clipStart)/86400000)+1;weeks.push({start:clipStart,end:clipEnd,days:days});cur=new Date(clipEnd);cur.setDate(cur.getDate()+1)}return weeks}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weeklyBudgetData(m,c,year,mIdx){var totalDays=new Date(year,mIdx+1,0).getDate(),weeks=getMonthWeeks(year,mIdx),totalBudget=c.budget;return weeks.map(function(w){var budget=totalBudget>0?totalBudget*(w.days/totalDays):0;var sISO=toISO(w.start),eISO=toISO(w.end);var spent=m.expenses.reduce(function(s,e){return(e.date>=sISO&&e.date<=eISO)?s+(+e.amount||0):s},0);var remaining=budget-spent;var pct=budget>0?Math.max(0,Math.min(100,remaining/budget*100)):(spent>0?0:100);var color=pct>=50?'green':(pct>=20?'yellow':'red');return{start:w.start,end:w.end,budget:budget,spent:spent,remaining:remaining,pct:pct,color:color}})}
function categoryTotals(scope){var totals={};function add(list){list.forEach(function(e){var k=e.cat||'Altro';totals[k]=(totals[k]||0)+(+e.amount||0)})}if(scope==='month'){add(getMonths()[monthIndex].expenses)}else{getMonths().forEach(function(m){add(m.expenses)})}var arr=Object.keys(totals).map(function(k){return{cat:k,amount:totals[k]}}).filter(function(x){return x.amount>0}).sort(function(a,b){return b.amount-a.amount});return arr}
function catColor(i){return CATCOLORS[i%CATCOLORS.length]}
function activate(name){page=name;['dashboard','months','investments','settings'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==name)});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===name)});render()}
function render(){if(page==='dashboard')renderDashboard();if(page==='months')renderMonths();if(page==='investments')renderInvestments();if(page==='settings')renderSettings()}
function renderDashboard(){var total={income:0,planned:0,spent:0,real:0},rows='';getMonths().forEach(function(m){var c=calc(m);Object.keys(total).forEach(function(k){total[k]+=c[k]});rows+='<tr><td>'+m.name+'</td><td>'+money(c.income)+'</td><td>'+money(c.spent)+'</td><td class="'+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</td></tr>'});var old=Object.keys(DATA.historical).reduce(function(s,y){return s+(+DATA.historical[y]||0)},0);
var catData=categoryTotals(dashCatScope),catTotal=catData.reduce(function(s,c){return s+c.amount},0);
var catListHtml=catData.length?catData.map(function(c,i){var pct=catTotal>0?(c.amount/catTotal*100):0;return'<div class="catrow"><span class="catdot" style="background:'+catColor(i)+'"></span><span class="catname">'+c.cat+'</span><span class="catval">'+money(c.amount)+' <span class="muted">('+pct.toFixed(0)+'%)</span></span></div>'}).join(''):'<p class="muted">Nessuna spesa registrata.</p>';
document.getElementById('dashboard').innerHTML='<div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(total.income)+'</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">'+money(total.planned)+'</div></div><div class="stat"><small>Spese variabili</small><div class="value">'+money(total.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(total.real>=0?'pos':'neg')+'">'+money(total.real)+'</div></div></div><div class="card"><h2>Entrate, spese e risparmio</h2><div class="chart"><canvas id="chartMain"></canvas></div></div><div class="card"><h2>Risparmio cumulato</h2><div class="chart"><canvas id="chartCum"></canvas></div></div><div class="card"><h2>Spese per categoria</h2><div class="pill-tabs"><button data-catscope="month" class="'+(dashCatScope==='month'?'active':'')+'">'+getMonths()[monthIndex].name+'</button><button data-catscope="year" class="'+(dashCatScope==='year'?'active':'')+'">Tutto '+DATA.currentYear+'</button></div><div class="chart donut"><canvas id="chartCat"></canvas></div><div class="catlist">'+catListHtml+'</div></div><div class="card"><h2>Riepilogo '+DATA.currentYear+'</h2><div class="table"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h2>Risparmi degli anni precedenti</h2><p class="muted">Totale storico: '+money(old)+'</p><div id="historyRows"></div><div class="actions"><button class="btn secondary" id="addHistory">Aggiungi anno</button></div></div>';
var labels=getMonths().map(function(m){return m.name.slice(0,3)}),cs=getMonths().map(calc),running=0;var gridColor=getComputedStyle(document.documentElement).getPropertyValue('--line');var textColor=getComputedStyle(document.documentElement).getPropertyValue('--muted');var cardBg=getComputedStyle(document.documentElement).getPropertyValue('--card');destroyCharts();
charts.main=new Chart(document.getElementById('chartMain'),{type:'bar',data:{labels:labels,datasets:[{label:'Entrate',data:cs.map(function(c){return c.income}),backgroundColor:'#4f6df5'},{label:'Spese',data:cs.map(function(c){return c.fixed+c.spent}),backgroundColor:'#d63d47'},{label:'Risparmio reale',data:cs.map(function(c){return c.real}),backgroundColor:'#168447'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textColor}}},scales:{x:{ticks:{color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});
charts.cum=new Chart(document.getElementById('chartCum'),{type:'line',data:{labels:labels,datasets:[{label:'Cumulato',data:cs.map(function(c){return running+=c.real}),borderColor:'#8d5cf6',backgroundColor:'#8d5cf633',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textColor}}},scales:{x:{ticks:{color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});
if(catData.length){charts.cat=new Chart(document.getElementById('chartCat'),{type:'doughnut',data:{labels:catData.map(function(c){return c.cat}),datasets:[{data:catData.map(function(c){return c.amount}),backgroundColor:catData.map(function(c,i){return catColor(i)}),borderColor:cardBg,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+money(ctx.raw)}}}}}})}
renderHistory();
document.getElementById('addHistory').onclick=function(){var y=prompt('Anno precedente');if(y&&!Object.prototype.hasOwnProperty.call(DATA.historical,y)){DATA.historical[y]=0;save();render()}};
document.querySelectorAll('[data-catscope]').forEach(function(b){b.onclick=function(){dashCatScope=b.dataset.catscope;render()}})}
function destroyCharts(){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy()});charts={}}
function renderHistory(){var box=document.getElementById('historyRows');if(!box)return;box.innerHTML=Object.keys(DATA.historical).sort().map(function(y){return'<div class="history"><b>'+y+'</b><input data-hist="'+y+'" type="number" step=".01" value="'+DATA.historical[y]+'"><button class="btn danger" data-delhist="'+y+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessun anno inserito.</p>';box.querySelectorAll('[data-hist]').forEach(function(i){i.onchange=function(){DATA.historical[i.dataset.hist]=+i.value||0;save();render()}});box.querySelectorAll('[data-delhist]').forEach(function(b){b.onclick=function(){delete DATA.historical[b.dataset.delhist];save();render()}})}
function renderMonths(){var m=getMonths()[monthIndex];sortExpenses(m);var c=calc(m);var tabs=getMonths().map(function(x,i){return'<button class="'+(i===monthIndex?'active':'')+'" data-mi="'+i+'">'+x.name.slice(0,3)+'</button>'}).join('');
var weeks=weeklyBudgetData(m,c,DATA.currentYear,monthIndex);

function renderInvestments(){if(!DATA.investments.years[invYear])DATA.investments.years[invYear]={};var invYears=Object.keys(DATA.investments.years).map(Number).sort(function(a,b){return a-b}),labels=['Anni precedenti'],values=[Number(DATA.investments.previous)||0],running=values[0];invYears.forEach(function(y){MONTHS.forEach(function(m){running+=Number((DATA.investments.years[y]||{})[m]||0);labels.push(y+' '+m.slice(0,3));values.push(running)})});var av=DATA.investments.years[invYear]||{};var yearOptions=invYears.map(function(y){return'<option value="'+y+'" '+(y===invYear?'selected':'')+'>'+y+'</option>'}).join('');document.getElementById('investments').innerHTML='<div class="card"><h2>Investimenti</h2><div class="field"><label>Totale anni precedenti</label><input id="previous" type="number" value="'+(DATA.investments.previous||0)+'"></div><button class="btn primary" id="savePrevious">Salva</button></div><div class="card"><h2>Investimenti cumulati di tutti gli anni</h2><div class="chart"><canvas id="chartInvestments"></canvas></div><p class="muted">Totale complessivo: '+money(running)+'</p></div><div class="card"><h2>Investimenti mensili</h2><div class="invyear"><select id="invYearSelect">'+yearOptions+'</select><button class="btn secondary" id="addInvYear">+ Anno</button></div>'+MONTHS.map(function(m){return'<div class="expense" style="grid-template-columns:1fr 1fr"><b style="font-size:13px">'+m+'</b><input data-invest="'+m+'" type="number" step=".01" value="'+(av[m]||0)+'" style="font-size:13px;min-height:34px;padding:6px 7px"></div>'}).join('')+'</div>';var gridColor=getComputedStyle(document.documentElement).getPropertyValue('--line');var textColor=getComputedStyle(document.documentElement).getPropertyValue('--muted');if(window.__investmentChart)window.__investmentChart.destroy();window.__investmentChart=new Chart(document.getElementById('chartInvestments'),{type:'line',data:{labels:labels,datasets:[{label:'Totale cumulato',data:values,borderColor:'#f59e0b',backgroundColor:'#f59e0b33',fill:true,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:textColor}}},scales:{x:{ticks:{maxRotation:60,minRotation:45,autoSkip:true,maxTicksLimit:18,color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});document.getElementById('savePrevious').onclick=function(){DATA.investments.previous=+document.getElementById('previous').value||0;save();render()};document.getElementById('invYearSelect').onchange=function(e){invYear=+e.target.value;render()};document.getElementById('addInvYear').onclick=function(){var y=prompt('Anno da aggiungere (es. 2025)');y=parseInt(y,10);if(y&&!DATA.investments.years[y]){DATA.investments.years[y]={};save()}if(y){invYear=y;render()}};document.querySelectorAll('[data-invest]').forEach(function(i){i.onchange=function(){av[i.dataset.invest]=+i.value||0;DATA.investments.years[invYear]=av;save();render()}})}
function renderSettings(){var mode=DATA.theme.mode;document.getElementById('settings').innerHTML='<div class="settings-grid"><div class="card settings-card"><h2>Importazione iniziale</h2><p class="muted">Importa i fogli Configurazione, Spese, Investimenti (tutti gli anni) e StoricoRisparmi.</p><label class="btn primary">Importa Excel iniziale<input id="excelFile" type="file" accept=".xlsx,.xls" hidden></label></div><div class="card settings-card"><h2>Aspetto</h2><p class="muted">Modalità</p><div class="mode-toggle"><button data-mode="light" class="'+(mode==='light'?'active':'')+'">☀️ Chiaro</button><button data-mode="dark" class="'+(mode==='dark'?'active':'')+'">🌙 Scuro</button><button data-mode="auto" class="'+(mode==='auto'?'active':'')+'">🔄 Auto</button></div><p class="muted" style="margin-top:14px">Colore principale</p><div class="themes">'+ACCENTS.map(function(c){return'<button class="theme'+(DATA.theme.accent===c?' active':'')+'" data-accent="'+c+'" style="background:'+c+'"></button>'}).join('')+'</div></div><div class="card settings-card"><h2>Backup manuale</h2><p class="muted">L\'esportazione Excel include configurazione mensile, spese, investimenti mensili di tutti gli anni, totale anni precedenti e risparmi storici.</p><div class="actions"><button class="btn primary" id="exportJson">Esporta JSON</button><button class="btn secondary" id="exportExcel">Esporta Excel</button><button class="btn secondary" id="importJson">Importa JSON</button><input id="fileJson" type="file" accept=".json" hidden></div></div></div>';document.getElementById('excelFile').onchange=importExcel;document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){DATA.theme.mode=b.dataset.mode;applyTheme();save();render()}});document.querySelectorAll('[data-accent]').forEach(function(b){b.onclick=function(){DATA.theme.accent=b.dataset.accent;applyTheme();save();render()}});document.getElementById('exportJson').onclick=function(){download('gestione-risparmi.json',JSON.stringify(DATA,null,2),'application/json');notify('JSON esportato')};document.getElementById('exportExcel').onclick=function(){exportCompatibleXlsx();notify('Excel esportato')};document.getElementById('importJson').onclick=function(){document.getElementById('fileJson').click()};document.getElementById('fileJson').onchange=function(e){var r=new FileReader();r.onload=function(){DATA=JSON.parse(r.result);if(!DATA.theme)DATA.theme=seed.theme;if(!DATA.theme.mode)DATA.theme.mode='light';if(!DATA.historical)DATA.historical={};if(!DATA.investments.years)DATA.investments.years={};save();applyTheme();fillYears();invYear=DATA.currentYear;render();notify('Importazione completata')};r.readAsText(e.target.files[0])}}
function normalizeDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}var s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var p=s.split(/[\/.-]/);if(p.length===3)return(p[2].length===2?'20'+p[2]:p[2])+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');return null}
function importExcel(e){var file=e.target.files[0];if(!file)return;if(DATA.excelImportato&&!confirm('Sostituire i dati attuali?'))return;var r=new FileReader();r.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),cfg=wb.Sheets.Configurazione,sp=wb.Sheets.Spese,inv=wb.Sheets.Investimenti,sto=wb.Sheets.StoricoRisparmi;if(!cfg||!sp)throw Error('Fogli mancanti');var next={currentYear:2026,years:{},investments:{previous:0,years:{}},historical:{},categories:DATA.categories||CATS.slice(),theme:DATA.theme,excelImportato:true};XLSX.utils.sheet_to_json(cfg,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),ix=MONTHS.indexOf(mn);if(!y||ix<0)return;if(!next.years[y])next.years[y]={months:blank()};var m=next.years[y].months[ix];m.stipendio=+row.Stipendio||0;m.extra=+row['Entrate extra']||0;m.percent=+row['Risparmio %']||0;m.fisse.auto=+row.Auto||0;m.fisse.telefono=+row.Telefono||0;m.fisse.abbonamenti=+row.Abbonamenti||0;m.viaggi=+row['Spese viaggi']||0;m.speseExtra=+row['Spese extra']||0});XLSX.utils.sheet_to_json(sp,{defval:''}).forEach(function(row){var d=normalizeDate(row.Data),cat=String(row.Categoria||'').trim(),amount=+row.Importo||0;if(!d||!cat||amount<=0)return;var dt=new Date(d+'T00:00:00'),y=dt.getFullYear(),ix=dt.getMonth();if(!next.years[y])next.years[y]={months:blank()};if(next.categories.indexOf(cat)<0)next.categories.push(cat);next.years[y].months[ix].expenses.push({date:d,cat:cat,desc:String(row.Descrizione||''),amount:amount})});Object.keys(next.years).forEach(function(y){next.years[y].months.forEach(sortExpenses)});if(inv)XLSX.utils.sheet_to_json(inv,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),v=+row.Importo||0;if(mn==='Anni precedenti'){next.investments.previous=v;return}if(y&&MONTHS.indexOf(mn)>=0){if(!next.investments.years[y])next.investments.years[y]={};next.investments.years[y][mn]=v}});if(sto)XLSX.utils.sheet_to_json(sto,{defval:''}).forEach(function(row){var y=String(row.Anno||'').trim(),v=+row.Importo||0;if(y)next.historical[y]=v});if(!Object.keys(next.years).length)next.years[2026]={months:blank()};next.currentYear=+Object.keys(next.years).sort()[0];DATA=next;save();fillYears();applyTheme();invYear=DATA.currentYear;activate('dashboard');notify('Importazione completata')}catch(err){alert('Errore importazione: '+err.message)}};r.readAsArrayBuffer(file)}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}
function exportCompatibleXlsx(){var wb=XLSX.utils.book_new(),cfg=[['Anno','Mese','Stipendio','Entrate extra','Risparmio %','Auto','Telefono','Abbonamenti','Spese viaggi','Spese extra']];Object.keys(DATA.years).sort().forEach(function(y){DATA.years[y].months.forEach(function(m){cfg.push([+y,m.name,m.stipendio,m.extra,m.percent,m.fisse.auto,m.fisse.telefono,m.fisse.abbonamenti,m.viaggi||0,m.speseExtra||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cfg),'Configurazione');var sp=[['Data','Categoria','Descrizione','Importo']];Object.values(DATA.years).forEach(function(y){y.months.forEach(function(m){m.expenses.forEach(function(e){sp.push([e.date,e.cat,e.desc,e.amount])})})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sp),'Spese');var inv=[['Anno','Mese','Importo'],['','Anni precedenti',DATA.investments.previous||0]];Object.keys(DATA.investments.years).map(Number).sort(function(a,b){return a-b}).forEach(function(y){MONTHS.forEach(function(m){inv.push([y,m,(DATA.investments.years[y]||{})[m]||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(inv),'Investimenti');var sto=[['Anno','Importo']];Object.keys(DATA.historical).sort().forEach(function(y){sto.push([y,DATA.historical[y]||0])});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sto),'StoricoRisparmi');XLSX.writeFile(wb,'gestione-risparmi-esportazione.xlsx')}
