<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f6df5"><title>Gestione Risparmi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--a:#4f6df5;--bg:#f4f6fb;--card:#fff;--text:#182235;--muted:#697386;--line:#e3e7ef;--green:#168447;--red:#d63d47;--safe:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--text:#eef1f7;--muted:#9aa3b8;--line:#2c3140;--green:#39d17f;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(92px + var(--safe));overflow-x:hidden;transition:background .2s,color .2s}
.top{position:relative;background:var(--card);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 14px 12px}
.topin{max-width:760px;margin:auto;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:800;font-size:16px}
.year{display:flex;gap:5px}
.year select,.year button{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--text);font-size:13px}
.year button,.primary{background:var(--a)!important;border-color:var(--a)!important;color:#fff!important}
main{max-width:760px;margin:auto;padding:12px 14px 24px}
.nav{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:8px 2px;font-size:11px}
.nav button.active{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.045)}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:11px}
.stat small{display:block;color:var(--muted);font-size:10px}
.value{font-size:17px;font-weight:800;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}
.chart{height:195px}
.table{overflow:auto}
.table table{width:100%;border-collapse:collapse;min-width:0}
.table th,.table td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px}
.table th{color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;color:var(--a)}
.tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 5px}
.field input,.field select,.catinput{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--text);font:inherit}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;min-height:42px;cursor:pointer}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.danger{background:#ffe8e9;color:var(--red)}
[data-theme="dark"] .danger{background:#3a1f22;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 130px;text-align:center}
.expense{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.expense input,.expense select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:var(--card);color:var(--text);font-size:12.5px}
.expense .wide{grid-column:1/-1}
.expense .btn.danger{padding:5px 8px;font-size:11.5px;min-height:32px;grid-column:1/-1;justify-self:end;width:auto}
.hidden{display:none!important}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe));z-index:100;width:52px;height:52px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:25px;box-shadow:0 5px 18px rgba(0,0,0,.25);cursor:pointer}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);align-items:flex-end}
.modal.open{display:flex}
.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe))}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.theme{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.theme.active{border-color:var(--text)}
.mode-toggle{display:flex;gap:8px;flex-wrap:wrap}
.mode-toggle button{flex:1 1 90px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px;font-weight:600;font-size:13px;cursor:pointer}
.mode-toggle button.active{background:var(--a);border-color:var(--a);color:#fff}
.settings-grid{display:grid;gap:14px}
.settings-card{margin:0}
.history{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:520px){.form{grid-template-columns:1fr}.card{padding:13px}.chart{height:185px}.brand{font-size:14px}.year select,.year button{font-size:12px;padding:8px}.history{grid-template-columns:1fr 1fr}.history .btn{grid-column:1/-1}}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}body{padding-bottom:30px}.fab{bottom:24px}.modal{align-items:center;justify-content:center}.sheet{width:500px;border-radius:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">💰 Gestione Risparmi</div><div class="year"><select id="yearSelect"></select><button id="addYear">+ Anno</button></div></div></header>
<main><nav class="nav" id="nav"><button class="active" data-page="dashboard">📊<br>Dashboard</button><button data-page="months">🗓️<br>Mesi</button><button data-page="investments">📈<br>Investimenti</button><button data-page="settings">⚙️<br>Impostazioni</button></nav><section id="dashboard"></section><section id="months" class="hidden"></section><section id="investments" class="hidden"></section><section id="settings" class="hidden"></section></main>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="sheet"><h2>Aggiungi spesa</h2><div class="field"><label>Data</label><input id="nDate" type="date"></div><div class="field"><label>Categoria</label><select id="nCat"></select></div><div class="field"><label>Descrizione</label><input id="nDesc"></div><div class="field"><label>Importo</label><input id="nAmount" type="number" step=".01"></div><div class="actions"><button class="btn secondary" id="closeModal">Annulla</button><button class="btn primary" id="saveNew">Salva</button></div></div></div>
<script>
(function(){'use strict';
var MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],
CATS=['Spesa','Trasporti','Ristoranti','Shopping','Salute','Intrattenimento','Uscite serali','Altro','Viaggi'],
KEY='gestione-risparmi-excel-v1',
ACCENTS=['#4f6df5','#8da2ff','#168447','#d78619','#8d5cf6','#e0578f'];
function blank(){return MONTHS.map(function(name){return{name:name,stipendio:0,extra:0,percent:20,fisse:{auto:0,telefono:0,abbonamenti:0},viaggi:0,speseExtra:0,expenses:[]}})}
var seed={currentYear:2026,years:{2026:{months:blank()}},investments:{previous:0,years:{2026:{}}},historical:{},categories:CATS.slice(),theme:{accent:'#4f6df5',mode:'light'},excelImportato:false};
MONTHS.forEach(function(m){seed.investments.years[2026][m]=0});
var DATA;try{DATA=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DATA=null}
if(!DATA||!DATA.years)DATA=seed;
if(!DATA.categories)DATA.categories=CATS.slice();
if(!DATA.historical)DATA.historical={};
if(!DATA.theme)DATA.theme=seed.theme;
if(!DATA.theme.accent)DATA.theme.accent='#4f6df5';
if(!DATA.theme.mode)DATA.theme.mode='light';
if(!DATA.investments)DATA.investments=seed.investments;
if(!DATA.investments.years)DATA.investments.years={};
if(!DATA.investments.years[DATA.currentYear])DATA.investments.years[DATA.currentYear]={};
var page='dashboard',monthIndex=0,charts={};
function save(){localStorage.setItem(KEY,JSON.stringify(DATA))}
function getMonths(){return DATA.years[DATA.currentYear].months}
function money(n){return(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function calc(m){var income=(+m.stipendio||0)+(+m.extra||0),planned=income*(+m.percent||0)/100,fixed=(+m.fisse.auto||0)+(+m.fisse.telefono||0)+(+m.fisse.abbonamenti||0),spent=m.expenses.reduce(function(s,e){return s+(+e.amount||0)},0),travel=+m.viaggi||0,extra=+m.speseExtra||0;return{income:income,planned:planned,fixed:fixed,spent:spent,budget:income-planned-fixed,real:income-fixed-spent-travel-extra}}
function sortExpenses(m){m.expenses.sort(function(a,b){if(a.date>b.date)return -1;if(a.date<b.date)return 1;return 0})}
function activate(name){page=name;['dashboard','months','investments','settings'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==name)});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===name)});render()}
function render(){if(page==='dashboard')renderDashboard();if(page==='months')renderMonths();if(page==='investments')renderInvestments();if(page==='settings')renderSettings()}
function renderDashboard(){var total={income:0,planned:0,spent:0,real:0},rows='';getMonths().forEach(function(m){var c=calc(m);Object.keys(total).forEach(function(k){total[k]+=c[k]});rows+='<tr><td>'+m.name+'</td><td>'+money(c.income)+'</td><td>'+money(c.spent)+'</td><td class="'+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</td></tr>'});var old=Object.keys(DATA.historical).reduce(function(s,y){return s+(+DATA.historical[y]||0)},0);document.getElementById('dashboard').innerHTML='<div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(total.income)+'</div></div><div class="stat"><small>Risparmi pianificati</small><div class="value">'+money(total.planned)+'</div></div><div class="stat"><small>Spese variabili</small><div class="value">'+money(total.spent)+'</div></div><div class="stat"><small>Risparmio reale</small><div class="value '+(total.real>=0?'pos':'neg')+'">'+money(total.real)+'</div></div></div><div class="card"><h2>Entrate, spese e risparmio</h2><div class="chart"><canvas id="chartMain"></canvas></div></div><div class="card"><h2>Risparmio cumulato</h2><div class="chart"><canvas id="chartCum"></canvas></div></div><div class="card"><h2>Riepilogo '+DATA.currentYear+'</h2><div class="table"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Spese</th><th>Risparmio reale</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h2>Risparmi degli anni precedenti</h2><p class="muted">Totale storico: '+money(old)+'</p><div id="historyRows"></div><div class="actions"><button class="btn secondary" id="addHistory">Aggiungi anno</button></div></div>';var labels=getMonths().map(function(m){return m.name.slice(0,3)}),cs=getMonths().map(calc),running=0;var gridColor=getComputedStyle(document.documentElement).getPropertyValue('--line');var textColor=getComputedStyle(document.documentElement).getPropertyValue('--muted');destroyCharts();charts.main=new Chart(document.getElementById('chartMain'),{type:'bar',data:{labels:labels,datasets:[{label:'Entrate',data:cs.map(function(c){return c.income}),backgroundColor:'#4f6df5'},{label:'Spese',data:cs.map(function(c){return c.fixed+c.spent}),backgroundColor:'#d63d47'},{label:'Risparmio reale',data:cs.map(function(c){return c.real}),backgroundColor:'#168447'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textColor}}},scales:{x:{ticks:{color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});charts.cum=new Chart(document.getElementById('chartCum'),{type:'line',data:{labels:labels,datasets:[{label:'Cumulato',data:cs.map(function(c){return running+=c.real}),borderColor:'#8d5cf6',backgroundColor:'#8d5cf633',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textColor}}},scales:{x:{ticks:{color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});renderHistory();document.getElementById('addHistory').onclick=function(){var y=prompt('Anno precedente');if(y&&!Object.prototype.hasOwnProperty.call(DATA.historical,y)){DATA.historical[y]=0;save();render()}}}
function destroyCharts(){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy()});charts={}}
function renderHistory(){var box=document.getElementById('historyRows');if(!box)return;box.innerHTML=Object.keys(DATA.historical).sort().map(function(y){return'<div class="history"><b>'+y+'</b><input data-hist="'+y+'" type="number" step=".01" value="'+DATA.historical[y]+'"><button class="btn danger" data-delhist="'+y+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessun anno inserito.</p>';box.querySelectorAll('[data-hist]').forEach(function(i){i.onchange=function(){DATA.historical[i.dataset.hist]=+i.value||0;save();render()}});box.querySelectorAll('[data-delhist]').forEach(function(b){b.onclick=function(){delete DATA.historical[b.dataset.delhist];save();render()}})}
function renderMonths(){var m=getMonths()[monthIndex];sortExpenses(m);var c=calc(m);var tabs=getMonths().map(function(x,i){return'<button class="'+(i===monthIndex?'active':'')+'" data-mi="'+i+'">'+x.name.slice(0,3)+'</button>'}).join('');var ex=m.expenses.map(function(e,i){return'<div class="expense" data-ei="'+i+'"><input data-f="date" type="date" value="'+e.date+'"><select data-f="cat">'+DATA.categories.map(function(x){return'<option '+(x===e.cat?'selected':'')+'>'+x+'</option>'}).join('')+'</select><input class="wide" data-f="desc" value="'+String(e.desc||'').replace(/"/g,'&quot;')+'"><input data-f="amount" type="number" step=".01" value="'+(e.amount||0)+'"><button class="btn danger" data-delexp="'+i+'">Elimina</button></div>'}).join('')||'<p class="muted">Nessuna spesa.</p>';document.getElementById('months').innerHTML='<div class="tabs">'+tabs+'</div><div class="card"><h2>'+m.name+' '+DATA.currentYear+'</h2><div class="form"><div class="field"><label>Stipendio</label><input id="salary" type="number" value="'+m.stipendio+'"></div><div class="field"><label>Entrate extra</label><input id="extra" type="number" value="'+m.extra+'"></div><div class="field"><label>Risparmio %</label><input id="percent" type="number" value="'+m.percent+'"></div><div class="field"><label>Auto</label><input id="auto" type="number" value="'+m.fisse.auto+'"></div><div class="field"><label>Telefono</label><input id="phone" type="number" value="'+m.fisse.telefono+'"></div><div class="field"><label>Abbonamenti</label><input id="subs" type="number" value="'+m.fisse.abbonamenti+'"></div><div class="field"><label>Spese viaggi</label><input id="travel" type="number" value="'+(m.viaggi||0)+'"></div><div class="field"><label>Spese extra</label><input id="other" type="number" value="'+(m.speseExtra||0)+'"></div></div><button class="btn primary" id="saveConfig">Salva configurazione</button></div><div class="stats"><div class="stat"><small>Entrate</small><div class="value">'+money(c.income)+'</div></div><div class="stat"><small>Budget variabili</small><div class="value">'+money(c.budget)+'</div></div><div class="stat"><small>Spese</small><div class="value">'+money(c.spent)+'</div></div><div class="stat"><small>Reale</small><div class="value '+(c.real>=0?'pos':'neg')+'">'+money(c.real)+'</div></div></div><div class="card"><h2>Registro spese</h2>'+ex+'</div>';document.querySelectorAll('[data-mi]').forEach(function(b){b.onclick=function(){monthIndex=+b.dataset.mi;render()}});document.getElementById('saveConfig').onclick=function(){m.stipendio=+salary.value||0;m.extra=+extra.value||0;m.percent=+percent.value||0;m.fisse.auto=+auto.value||0;m.fisse.telefono=+phone.value||0;m.fisse.abbonamenti=+subs.value||0;m.viaggi=+travel.value||0;m.speseExtra=+other.value||0;save();render()};document.querySelectorAll('[data-ei]').forEach(function(row){var i=+row.dataset.ei;row.querySelectorAll('[data-f]').forEach(function(input){input.onchange=function(){var f=input.dataset.f;if(f==='date')m.expenses[i].date=input.value;if(f==='cat')m.expenses[i].cat=input.value;if(f==='desc')m.expenses[i].desc=input.value;if(f==='amount')m.expenses[i].amount=+input.value||0;save();if(f==='date'){sortExpenses(m);render()}}})});document.querySelectorAll('[data-delexp]').forEach(function(b){b.onclick=function(){m.expenses.splice(+b.dataset.delexp,1);save();render()}})}
function renderInvestments(){var years=Object.keys(DATA.investments.years).map(Number).sort(function(a,b){return a-b}),labels=['Anni precedenti'],values=[Number(DATA.investments.previous)||0],running=values[0];years.forEach(function(y){MONTHS.forEach(function(m){running+=Number((DATA.investments.years[y]||{})[m]||0);labels.push(y+' '+m.slice(0,3));values.push(running)})});var av=DATA.investments.years[DATA.currentYear]||{};document.getElementById('investments').innerHTML='<div class="card"><h2>Investimenti</h2><div class="field"><label>Totale anni precedenti</label><input id="previous" type="number" value="'+(DATA.investments.previous||0)+'"></div><button class="btn primary" id="savePrevious">Salva</button></div><div class="card"><h2>Investimenti cumulati di tutti gli anni</h2><div class="chart"><canvas id="chartInvestments"></canvas></div><p class="muted">Totale complessivo: '+money(running)+'</p></div><div class="card"><h2>Investimenti mensili '+DATA.currentYear+'</h2>'+MONTHS.map(function(m){return'<div class="expense"><b>'+m+'</b><input data-invest="'+m+'" type="number" step=".01" value="'+(av[m]||0)+'"></div>'}).join('')+'</div>';var gridColor=getComputedStyle(document.documentElement).getPropertyValue('--line');var textColor=getComputedStyle(document.documentElement).getPropertyValue('--muted');if(window.__investmentChart)window.__investmentChart.destroy();window.__investmentChart=new Chart(document.getElementById('chartInvestments'),{type:'line',data:{labels:labels,datasets:[{label:'Totale cumulato',data:values,borderColor:'#f59e0b',backgroundColor:'#f59e0b33',fill:true,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:textColor}}},scales:{x:{ticks:{maxRotation:60,minRotation:45,autoSkip:true,maxTicksLimit:18,color:textColor},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});document.getElementById('savePrevious').onclick=function(){DATA.investments.previous=+document.getElementById('previous').value||0;save();render()};document.querySelectorAll('[data-invest]').forEach(function(i){i.onchange=function(){av[i.dataset.invest]=+i.value||0;DATA.investments.years[DATA.currentYear]=av;save();render()}})}
function renderSettings(){var mode=DATA.theme.mode;document.getElementById('settings').innerHTML='<div class="settings-grid"><div class="card settings-card"><h2>Importazione iniziale</h2><p class="muted">Importa i fogli Configurazione, Spese, Investimenti e StoricoRisparmi.</p><label class="btn primary">Importa Excel iniziale<input id="excelFile" type="file" accept=".xlsx,.xls" hidden></label></div><div class="card settings-card"><h2>Aspetto</h2><p class="muted">Modalità</p><div class="mode-toggle"><button data-mode="light" class="'+(mode==='light'?'active':'')+'">☀️ Chiaro</button><button data-mode="dark" class="'+(mode==='dark'?'active':'')+'">🌙 Scuro</button><button data-mode="auto" class="'+(mode==='auto'?'active':'')+'">🔄 Auto</button></div><p class="muted" style="margin-top:14px">Colore principale</p><div class="themes">'+ACCENTS.map(function(c){return'<button class="theme'+(DATA.theme.accent===c?' active':'')+'" data-accent="'+c+'" style="background:'+c+'"></button>'}).join('')+'</div></div><div class="card settings-card"><h2>Backup manuale</h2><p class="muted">L\'esportazione Excel include configurazione mensile, spese, investimenti e risparmi degli anni precedenti.</p><div class="actions"><button class="btn primary" id="exportJson">Esporta JSON</button><button class="btn secondary" id="exportExcel">Esporta Excel</button><button class="btn secondary" id="importJson">Importa JSON</button><input id="fileJson" type="file" accept=".json" hidden></div></div></div>';document.getElementById('excelFile').onchange=importExcel;document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){DATA.theme.mode=b.dataset.mode;applyTheme();save();render()}});document.querySelectorAll('[data-accent]').forEach(function(b){b.onclick=function(){DATA.theme.accent=b.dataset.accent;applyTheme();save();render()}});document.getElementById('exportJson').onclick=function(){download('gestione-risparmi.json',JSON.stringify(DATA,null,2),'application/json')};document.getElementById('exportExcel').onclick=exportCompatibleXlsx;document.getElementById('importJson').onclick=function(){document.getElementById('fileJson').click()};document.getElementById('fileJson').onchange=function(e){var r=new FileReader();r.onload=function(){DATA=JSON.parse(r.result);if(!DATA.theme)DATA.theme=seed.theme;if(!DATA.theme.mode)DATA.theme.mode='light';if(!DATA.historical)DATA.historical={};save();applyTheme();fillYears();render()};r.readAsText(e.target.files[0])}}
function normalizeDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}var s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var p=s.split(/[\/.-]/);if(p.length===3)return(p[2].length===2?'20'+p[2]:p[2])+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');return null}
function importExcel(e){var file=e.target.files[0];if(!file)return;if(DATA.excelImportato&&!confirm('Sostituire i dati attuali?'))return;var r=new FileReader();r.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),cfg=wb.Sheets.Configurazione,sp=wb.Sheets.Spese,inv=wb.Sheets.Investimenti,sto=wb.Sheets.StoricoRisparmi;if(!cfg||!sp)throw Error('Fogli mancanti');var next={currentYear:2026,years:{},investments:{previous:0,years:{}},historical:{},categories:DATA.categories||CATS.slice(),theme:DATA.theme,excelImportato:true};XLSX.utils.sheet_to_json(cfg,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),ix=MONTHS.indexOf(mn);if(!y||ix<0)return;if(!next.years[y])next.years[y]={months:blank()};var m=next.years[y].months[ix];m.stipendio=+row.Stipendio||0;m.extra=+row['Entrate extra']||0;m.percent=+row['Risparmio %']||0;m.fisse.auto=+row.Auto||0;m.fisse.telefono=+row.Telefono||0;m.fisse.abbonamenti=+row.Abbonamenti||0;m.viaggi=+row['Spese viaggi']||0;m.speseExtra=+row['Spese extra']||0});XLSX.utils.sheet_to_json(sp,{defval:''}).forEach(function(row){var d=normalizeDate(row.Data),cat=String(row.Categoria||'').trim(),amount=+row.Importo||0;if(!d||!cat||amount<=0)return;var dt=new Date(d+'T00:00:00'),y=dt.getFullYear(),ix=dt.getMonth();if(!next.years[y])next.years[y]={months:blank()};if(next.categories.indexOf(cat)<0)next.categories.push(cat);next.years[y].months[ix].expenses.push({date:d,cat:cat,desc:String(row.Descrizione||''),amount:amount})});Object.keys(next.years).forEach(function(y){next.years[y].months.forEach(sortExpenses)});if(inv)XLSX.utils.sheet_to_json(inv,{defval:''}).forEach(function(row){var y=+row.Anno,mn=String(row.Mese||'').trim(),v=+row.Importo||0;if(mn==='Anni precedenti')next.investments.previous=v;else if(y&&MONTHS.indexOf(mn)>=0){if(!next.investments.years[y])next.investments.years[y]={};next.investments.years[y][mn]=v}});if(sto)XLSX.utils.sheet_to_json(sto,{defval:''}).forEach(function(row){var y=String(row.Anno||'').trim(),v=+row.Importo||0;if(y)next.historical[y]=v});next.currentYear=+Object.keys(next.years).sort()[0];DATA=next;save();fillYears();applyTheme();activate('dashboard');alert('Importazione completata')}catch(err){alert('Errore importazione: '+err.message)}};r.readAsArrayBuffer(file)}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}
function exportCompatibleXlsx(){var wb=XLSX.utils.book_new(),cfg=[['Anno','Mese','Stipendio','Entrate extra','Risparmio %','Auto','Telefono','Abbonamenti','Spese viaggi','Spese extra']];Object.keys(DATA.years).sort().forEach(function(y){DATA.years[y].months.forEach(function(m){cfg.push([+y,m.name,m.stipendio,m.extra,m.percent,m.fisse.auto,m.fisse.telefono,m.fisse.abbonamenti,m.viaggi||0,m.speseExtra||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cfg),'Configurazione');var sp=[['Data','Categoria','Descrizione','Importo']];Object.values(DATA.years).forEach(function(y){y.months.forEach(function(m){m.expenses.forEach(function(e){sp.push([e.date,e.cat,e.desc,e.amount])})})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sp),'Spese');var inv=[['Anno','Mese','Importo']];Object.keys(DATA.investments.years).sort().forEach(function(y){Object.keys(DATA.investments.years[y]).forEach(function(m){inv.push([+y,m,DATA.investments.years[y][m]||0])})});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(inv),'Investimenti');var sto=[['Anno','Importo']];Object.keys(DATA.historical).sort().forEach(function(y){sto.push([y,DATA.historical[y]||0])});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sto),'StoricoRisparmi');XLSX.writeFile(wb,'gestione-risparmi-esportazione.xlsx')}
function applyTheme(){var mode=DATA.theme.mode||'light';var isDark=mode==='dark'||(mode==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',isDark?'dark':'light');document.documentElement.style.setProperty('--a',DATA.theme.accent||'#4f6df5')}
function fillYears(){document.getElementById('yearSelect').innerHTML=Object.keys(DATA.years).sort().map(function(y){return'<option value="'+y+'" '+(+y===DATA.currentYear?'selected':'')+'>'+y+'</option>'}).join('')}
document.getElementById('nav').onclick=function(e){var b=e.target.closest('button[data-page]');if(b)activate(b.dataset.page)};
document.getElementById('yearSelect').onchange=function(e){DATA.currentYear=+e.target.value;monthIndex=0;save();render()};
document.getElementById('addYear').onclick=function(){var y=Math.max.apply(null,Object.keys(DATA.years).map(Number))+1;DATA.years[y]={months:blank()};DATA.investments.years[y]={};DATA.currentYear=y;save();fillYears();render()};
document.getElementById('fab').onclick=function(){document.getElementById('nDate').value=new Date().toISOString().slice(0,10);document.getElementById('nCat').innerHTML=DATA.categories.map(function(c){return'<option>'+c+'</option>'}).join('');document.getElementById('modal').classList.add('open')};
document.getElementById('closeModal').onclick=function(){document.getElementById('modal').classList.remove('open')};
document.getElementById('saveNew').onclick=function(){var d=document.getElementById('nDate').value,ix=new Date(d+'T00:00:00').getMonth();getMonths()[ix].expenses.push({date:d,cat:document.getElementById('nCat').value,desc:document.getElementById('nDesc').value,amount:+document.getElementById('nAmount').value||0});sortExpenses(getMonths()[ix]);save();document.getElementById('modal').classList.remove('open');monthIndex=ix;activate('months')};
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(DATA.theme.mode==='auto')applyTheme()})}
applyTheme();fillYears();activate('dashboard')
